<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#006a70">
<title>TOEFL 2026 Practice Lab — Standalone</title>
<style>:root {
  --teal-950: #053c42;
  --teal-900: #064f56;
  --teal-800: #07636b;
  --teal-700: #08737c;
  --teal-600: #118691;
  --teal-100: #dff3f2;
  --teal-50: #eefafa;
  --navy-950: #132239;
  --navy-800: #223858;
  --navy-700: #314b70;
  --ink: #1d2838;
  --ink-2: #3e4b5d;
  --muted: #6f7c8d;
  --line: #dce3e8;
  --line-strong: #c7d0d7;
  --paper: #ffffff;
  --surface: #f5f7f8;
  --surface-2: #edf1f3;
  --success: #167453;
  --success-soft: #e5f6ef;
  --danger: #b83c45;
  --danger-soft: #fff0f1;
  --warning: #a75e00;
  --warning-soft: #fff4dd;
  --shadow-sm: 0 1px 2px rgba(14, 31, 44, .05), 0 5px 18px rgba(14, 31, 44, .05);
  --shadow-md: 0 16px 38px rgba(13, 42, 51, .11);
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 22px;
  --sidebar: 248px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--surface); color: var(--ink); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button, select { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid rgba(17, 134, 145, .25);
  outline-offset: 2px;
}
svg { display: block; }
.icon { display: inline-flex; width: 18px; height: 18px; flex: 0 0 auto; }
.icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* App shell */
.app-layout { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
.app-sidebar {
  position: sticky; top: 0; height: 100vh; padding: 24px 18px 18px;
  background: var(--paper); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; z-index: 5;
}
.brand-lockup { border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 5px; text-align: left; border-radius: 10px; }
.brand-lockup span:last-child { display: grid; }
.brand-lockup strong { font-size: 15px; letter-spacing: -.01em; }
.brand-lockup small { color: var(--muted); font-size: 11px; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  background: var(--teal-800); color: white; font-weight: 900; font-family: Georgia, serif; font-size: 22px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
}
.app-nav { display: grid; gap: 6px; margin-top: 34px; }
.app-nav-item {
  border: 0; background: transparent; color: var(--muted); min-height: 46px; border-radius: 10px;
  display: flex; align-items: center; gap: 12px; padding: 0 13px; font-weight: 650; text-align: left;
}
.app-nav-item:hover { background: var(--surface); color: var(--ink); }
.app-nav-item.active { color: var(--teal-800); background: var(--teal-50); }
.sidebar-foot { margin-top: auto; padding: 16px 7px 2px; display: grid; gap: 9px; color: var(--muted); }
.storage-indicator { font-size: 12px; display: flex; gap: 7px; align-items: center; }
.storage-indicator span { width: 7px; height: 7px; background: #33a875; border-radius: 999px; box-shadow: 0 0 0 3px #e4f5ed; }
.sidebar-foot small { font-size: 10px; }
.app-content-wrap { min-width: 0; }
.app-content { width: min(1240px, calc(100% - 64px)); margin: 0 auto; padding: 46px 0 72px; }
.app-mobile-header { display: none; }

.page-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; margin-bottom: 28px; }
.page-heading > div:first-child { max-width: 780px; }
.eyebrow { color: var(--teal-700); font-size: 11px; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 7px; }
.page-heading h1 { font-size: clamp(28px, 3vw, 43px); line-height: 1.08; letter-spacing: -.035em; margin: 0 0 10px; }
.page-heading p { color: var(--muted); margin: 0; max-width: 740px; font-size: 15px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.button {
  border: 1px solid var(--line-strong); background: var(--paper); min-height: 42px; padding: 9px 15px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 750; transition: transform .15s, box-shadow .15s, border-color .15s, background .15s;
}
.button:hover { transform: translateY(-1px); border-color: #9fafb8; box-shadow: var(--shadow-sm); }
.button.primary { background: var(--teal-800); color: white; border-color: var(--teal-800); }
.button.primary:hover { background: var(--teal-700); }
.button.ghost { background: var(--paper); }
.button.subtle { background: var(--surface); border-color: transparent; }
.button.light { background: rgba(255,255,255,.94); color: var(--ink); border-color: transparent; }
.button.large { min-height: 49px; font-size: 15px; }
.button.full { width: 100%; }
.text-button { border: 0; background: transparent; color: var(--teal-700); display: inline-flex; align-items: center; gap: 5px; padding: 6px; font-weight: 750; }
.text-button .icon { width: 15px; height: 15px; }
.text-button.danger { color: var(--danger); }
.icon-button { border: 1px solid var(--line); background: var(--paper); width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; }
.icon-button .icon { width: 15px; height: 15px; }

.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 22px; }
.panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
.panel-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
.muted { color: var(--muted); }
.status-pill { border-radius: 999px; background: var(--success-soft); color: var(--success); font-size: 11px; font-weight: 850; padding: 5px 9px; }
.status-pill.neutral { background: var(--surface-2); color: var(--ink-2); }

/* Dashboard */
.resume-banner {
  margin-bottom: 24px; background: var(--navy-950); color: white; border-radius: var(--radius);
  padding: 15px 17px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; box-shadow: var(--shadow-sm);
}
.resume-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px; background: rgba(255,255,255,.1); }
.resume-copy { display: grid; }
.resume-copy span { color: #aabbd0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 750; }
.resume-copy strong { font-size: 15px; }
.resume-copy small { color: #9fb0c4; }
.resume-actions { display: flex; gap: 8px; }
.resume-actions .ghost { color: white; border-color: rgba(255,255,255,.25); background: transparent; }

.hero-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.hero-card { min-height: 340px; border-radius: var(--radius-lg); padding: 24px; color: white; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: var(--shadow-md); }
.hero-card::after { content: ''; position: absolute; width: 260px; height: 260px; border-radius: 50%; right: -80px; top: -110px; border: 45px solid rgba(255,255,255,.06); pointer-events: none; }
.reading-card { background: linear-gradient(145deg, #0b747b, #064951); }
.writing-card { background: linear-gradient(145deg, #294665, #172b47); }
.hero-card-top { display: flex; justify-content: space-between; align-items: center; }
.section-chip, .format-chip { display: inline-flex; align-items: center; min-height: 27px; border-radius: 999px; padding: 4px 9px; font-size: 10px; font-weight: 850; letter-spacing: .09em; }
.section-chip { background: rgba(255,255,255,.14); color: white; }
.section-chip.teal { background: var(--teal-100); color: var(--teal-900); }
.section-chip.navy { background: #e8eef7; color: var(--navy-800); }
.format-chip { color: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.2); }
.hero-card h2 { font-size: 31px; line-height: 1.1; letter-spacing: -.035em; margin: 36px 0 10px; }
.hero-card > p { color: rgba(255,255,255,.76); max-width: 520px; margin: 0; }
.hero-card-footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.hero-card-footer > span { color: rgba(255,255,255,.67); font-size: 12px; }
.mini-ctest { margin: 24px 0 18px; font-family: Georgia, serif; font-size: 18px; color: rgba(255,255,255,.9); line-height: 1.8; }
.mini-ctest span { display: inline-block; background: rgba(255,255,255,.12); border-bottom: 2px solid rgba(255,255,255,.65); margin: 0 2px; padding: 0 4px; }
.writing-stages { margin: 30px 0 20px; display: flex; align-items: center; gap: 9px; }
.writing-stages span { border: 1px solid rgba(255,255,255,.25); border-radius: 7px; padding: 7px 9px; font-size: 10px; letter-spacing: .08em; font-weight: 800; }
.writing-stages i { width: 22px; height: 1px; background: rgba(255,255,255,.28); }
.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 20px 0; }
.stat-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); min-height: 135px; display: flex; flex-direction: column; }
.stat-label { color: var(--muted); font-size: 12px; font-weight: 700; }
.stat-card > strong { font-size: 28px; line-height: 1; margin: 11px 0 7px; letter-spacing: -.03em; }
.stat-card > span { color: var(--muted); font-size: 11px; margin-top: auto; }
.sparkline { width: 100%; height: 44px; margin-top: auto; overflow: visible; }
.sparkline polyline { stroke: var(--teal-600); stroke-width: 2.2; }
.sparkline line { stroke: var(--line); stroke-width: 1; }
.spark-empty { color: var(--muted); font-size: 11px; margin-top: auto; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, .75fr); gap: 18px; }
.recent-list { display: grid; }
.recent-row { border: 0; border-top: 1px solid var(--line); background: transparent; min-height: 68px; padding: 11px 3px; display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; text-align: left; }
.recent-row:first-child { border-top: 0; }
.recent-row:hover .recent-main strong { color: var(--teal-700); }
.recent-task-icon, .record-type { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 850; }
.recent-task-icon.ctw, .record-type.ctw { background: var(--teal-50); color: var(--teal-700); }
.recent-task-icon.writing, .record-type.writing { background: #edf1f8; color: var(--navy-700); }
.recent-main { display: grid; }
.recent-main strong { font-size: 14px; }
.recent-main small { color: var(--muted); font-size: 11px; }
.recent-score { font-weight: 850; }
.recent-row > .icon { width: 14px; color: var(--muted); }
.alignment-panel { background: linear-gradient(180deg, white, #f9fbfb); }
.check-list { list-style: none; padding: 0; display: grid; gap: 13px; margin: 21px 0; }
.check-list li { position: relative; padding-left: 26px; color: var(--ink-2); font-size: 13px; }
.check-list li::before { content: '✓'; position: absolute; left: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--success-soft); color: var(--success); display: grid; place-items: center; font-size: 11px; font-weight: 900; }

/* Practice */
.mode-toggle { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 19px; max-width: 720px; }
.mode-toggle button { border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 14px; text-align: left; display: grid; gap: 3px; }
.mode-toggle button strong { font-size: 14px; }
.mode-toggle button span { color: var(--muted); font-size: 11px; }
.mode-toggle button.active { border-color: var(--teal-600); box-shadow: 0 0 0 2px var(--teal-100); background: var(--teal-50); }
.practice-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; }
.practice-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
.practice-visual { height: 178px; padding: 34px; background: #eaf4f3; position: relative; overflow: hidden; }
.practice-visual::after { content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.42); right: -50px; top: -60px; }
.practice-visual .mock-top { position: absolute; top: 0; left: 0; right: 0; height: 19px; background: var(--teal-800); }
.ctw-visual p { background: white; border: 1px solid #d8e3e3; box-shadow: 0 14px 30px rgba(28,66,70,.08); padding: 22px; border-radius: 5px; font-family: Georgia, serif; font-size: 17px; line-height: 1.8; margin: 0; position: relative; z-index: 1; }
.ctw-visual p span { background: #edf1f1; border-bottom: 2px solid #718284; padding: 0 3px; }
.build-visual { background: #edf0f6; }
.build-visual .mock-top { background: var(--navy-800); }
.mock-bubbles { position: relative; z-index: 1; height: 100%; display: flex; justify-content: center; align-items: center; gap: 7px; }
.mock-bubbles span { background: white; border: 1px solid #d8dee7; border-radius: 7px; padding: 10px 13px; box-shadow: 0 6px 18px rgba(25,42,66,.08); font-weight: 650; }
.practice-body { padding: 23px; }
.practice-title-row { display: flex; align-items: center; justify-content: space-between; }
.verified-chip { font-size: 10px; color: var(--success); background: var(--success-soft); border-radius: 999px; padding: 4px 8px; font-weight: 800; }
.practice-body h2 { font-size: 25px; margin: 18px 0 7px; letter-spacing: -.025em; }
.practice-body > p { color: var(--muted); min-height: 46px; margin: 0 0 18px; }
.field { display: grid; gap: 6px; margin-bottom: 15px; }
.field > span { color: var(--ink-2); font-size: 11px; font-weight: 750; }
.field input, .field select { width: 100%; min-height: 43px; border: 1px solid var(--line-strong); background: var(--paper); border-radius: 9px; padding: 9px 11px; color: var(--ink); }
.stage-summary { min-height: 59px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
.stage-summary span { background: var(--surface); border-radius: 9px; padding: 8px; text-align: center; font-size: 10px; color: var(--muted); }
.stage-summary b { display: block; color: var(--ink); font-size: 14px; }
.notice-card { margin-top: 18px; border: 1px solid #cfe3e1; background: var(--teal-50); border-radius: var(--radius); padding: 16px; display: flex; gap: 13px; }
.notice-icon { width: 24px; height: 24px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; background: var(--teal-700); color: white; font-family: Georgia, serif; font-weight: 800; }
.notice-card p { margin: 3px 0 0; color: var(--ink-2); font-size: 13px; }

/* Records */
.records-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.segmented { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; }
.segmented button { border: 0; background: transparent; border-radius: 7px; min-height: 34px; padding: 5px 13px; color: var(--muted); font-weight: 700; font-size: 12px; }
.segmented button.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(20,35,45,.1); }
.record-count { color: var(--muted); font-size: 12px; }
.table-panel { padding: 0; overflow: hidden; }
.table-wrap { overflow-x: auto; }
.records-table, .review-table { width: 100%; border-collapse: collapse; }
.records-table th, .records-table td, .review-table th, .review-table td { padding: 14px 15px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.records-table th, .review-table th { color: var(--muted); background: #fafbfb; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.records-table tbody tr:last-child td, .review-table tbody tr:last-child td { border-bottom: 0; }
.record-type { width: 31px; height: 31px; }
.record-title { border: 0; background: transparent; display: grid; text-align: left; padding: 0; }
.record-title strong, .record-title { font-weight: 750; }
.record-title small { color: var(--muted); font-weight: 400; }
.danger-row { text-align: right; padding-top: 16px; }
.empty-state { min-height: 190px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: var(--muted); gap: 5px; }
.empty-state.compact { min-height: 150px; }
.empty-state.wide { grid-column: 1 / -1; background: var(--paper); border: 1px dashed var(--line-strong); border-radius: var(--radius); }
.empty-state strong { color: var(--ink); }

/* Vocabulary */
.vocab-scope { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(330px, .8fr); align-items: center; gap: 28px; background: linear-gradient(115deg, white, var(--teal-50)); }
.scope-copy h2 { margin: 0 0 7px; font-size: 22px; }
.scope-copy p { color: var(--muted); margin: 0; }
.cefr-track { display: grid; grid-template-columns: repeat(6,1fr); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.cefr-track span { height: 42px; display: grid; place-items: center; background: white; border-right: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 800; }
.cefr-track span:last-child { border-right: 0; }
.cefr-track .focus { background: var(--teal-700); color: white; }
.vocab-toolbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin: 18px 0; }
.search-field { min-width: 290px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 11px; }
.search-field > span { color: var(--muted); font-size: 20px; }
.search-field input { border: 0; background: transparent; min-height: 42px; width: 100%; outline: 0; }
.filter-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 3px; }
.filter-chip { white-space: nowrap; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 11px; color: var(--muted); font-size: 11px; font-weight: 700; }
.filter-chip.active { background: var(--teal-800); color: white; border-color: var(--teal-800); }
.word-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.word-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
.word-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.word-head h3 { margin: 0; font-family: Georgia, serif; font-size: 23px; letter-spacing: -.02em; }
.word-head > div > span { color: var(--muted); font-size: 11px; }
.bookmark-button { border: 0; background: var(--surface); width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); }
.bookmark-button.saved { background: var(--teal-100); color: var(--teal-800); }
.bookmark-button.saved .icon svg { fill: currentColor; }
.bookmark-button.small { width: 31px; height: 31px; }
.word-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 14px 0 9px; }
.word-tags span, .tag-row span { border-radius: 999px; background: var(--surface); color: var(--ink-2); padding: 3px 7px; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
.word-tags .miss-tag { background: var(--danger-soft); color: var(--danger); }
.word-card > p { color: var(--ink-2); min-height: 44px; }
.word-card dl { margin: 14px 0 0; display: grid; gap: 9px; }
.word-card dl div { border-top: 1px solid var(--line); padding-top: 8px; }
.word-card dt { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }
.word-card dd { margin: 2px 0 0; font-size: 12px; }

/* Settings */
.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.settings-card { min-width: 0; }
.wide-card { grid-column: 1 / -1; }
.form-grid { display: grid; gap: 13px; }
.form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.settings-actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.status-success { color: var(--success); }
.status-warning { color: var(--warning); }
.status-error { color: var(--danger); }
.pipeline-list { display: grid; gap: 11px; }
.pipeline-list > div { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 11px; border-radius: 10px; background: var(--surface); }
.pipeline-num { color: var(--teal-700); font-size: 10px; font-weight: 900; letter-spacing: .08em; }
.pipeline-list p { margin: 0; color: var(--ink-2); font-size: 12px; }
.pipeline-list p strong { color: var(--ink); display: block; }
.quality-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quality-grid div { border: 1px solid var(--line); border-radius: 10px; padding: 13px; display: grid; gap: 3px; }
.quality-grid strong { font-size: 13px; }
.quality-grid span { color: var(--muted); font-size: 11px; }
.source-list { display: grid; gap: 9px; margin: 16px 0; color: var(--ink-2); }
.small-note { border-top: 1px solid var(--line); padding-top: 13px; color: var(--muted); font-size: 11px; }
code { background: var(--surface-2); padding: 2px 5px; border-radius: 5px; }

/* Review */
.detail-back { margin-bottom: 18px; }
.result-badge { min-width: 54px; border-radius: 10px; padding: 8px 10px; background: var(--teal-50); color: var(--teal-800); font-weight: 900; text-align: center; }
.result-badge.big { font-size: 28px; border-radius: 14px; min-width: 92px; }
.result-badge span { font-size: 13px; color: var(--muted); }
.review-passage { padding: 32px; }
.review-passage p { font-family: Georgia, 'Times New Roman', serif; font-size: 19px; line-height: 2.15; margin: 18px 0 0; }
.review-legend { display: flex; gap: 15px; justify-content: flex-end; color: var(--muted); font-size: 11px; }
.review-legend span { display: flex; align-items: center; gap: 6px; }
.review-legend i { width: 9px; height: 9px; border-radius: 50%; }
.review-legend i.correct { background: var(--success); }
.review-legend i.incorrect { background: var(--danger); }
.review-gap { display: inline-flex; align-items: baseline; margin: 0 2px; border-bottom: 2px solid; padding: 0 3px; position: relative; }
.review-gap.correct { color: var(--success); background: var(--success-soft); }
.review-gap.incorrect { color: var(--danger); background: var(--danger-soft); }
.review-gap b { font-weight: 750; }
.review-gap small { position: absolute; top: -14px; right: 0; font: 8px/1 Inter, sans-serif; text-transform: uppercase; white-space: nowrap; }
.review-table .answer-ok { color: var(--success); }
.review-table .answer-bad { color: var(--danger); }
.result-ok, .result-bad { border-radius: 999px; padding: 4px 7px; font-size: 9px; font-weight: 850; text-transform: uppercase; }
.result-ok { background: var(--success-soft); color: var(--success); }
.result-bad { background: var(--danger-soft); color: var(--danger); }
.review-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }
.result-score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 13px; margin-bottom: 17px; }
.result-score-grid article { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
.result-score-grid article > span { color: var(--muted); font-size: 11px; }
.result-score-grid article > strong { display: block; font-size: 29px; margin: 7px 0 0; letter-spacing: -.03em; }
.result-score-grid article > strong small { color: var(--muted); font-size: 12px; }
.result-score-grid article > p { color: var(--muted); font-size: 10px; margin: 1px 0 0; }
.result-score-grid .calibration-card { background: var(--navy-950); color: white; border-color: var(--navy-950); }
.result-score-grid .calibration-card > span, .result-score-grid .calibration-card > p { color: #aabbcf; }
.result-score-grid .calibration-card > strong { font-size: 16px; margin-top: 13px; }
.review-writing-grid { display: grid; gap: 16px; }
.build-review-list { display: grid; gap: 8px; }
.build-review-item { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.build-review-item summary { list-style: none; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 11px; cursor: pointer; }
.build-review-item summary::-webkit-details-marker { display: none; }
.build-review-item summary > span { width: 25px; height: 25px; border-radius: 7px; display: grid; place-items: center; background: var(--surface); font-size: 10px; }
.build-review-item summary strong { font-size: 12px; }
.build-review-item summary em { font-style: normal; font-size: 9px; text-transform: uppercase; font-weight: 850; }
.build-review-item summary em.ok { color: var(--success); }
.build-review-item summary em.bad { color: var(--danger); }
.build-review-item > div { border-top: 1px solid var(--line); padding: 12px 15px; background: #fafbfb; color: var(--ink-2); font-size: 12px; }
.build-review-item p { margin: 4px 0; }
.tag-row { display: flex; gap: 5px; margin-top: 8px; }
.writing-response-card .response-text { min-height: 130px; background: var(--surface); border-radius: 10px; padding: 16px; white-space: normal; line-height: 1.7; color: var(--ink-2); }
.diagnostic-box { margin-top: 15px; border-left: 3px solid var(--teal-600); background: var(--teal-50); padding: 13px 15px; border-radius: 0 9px 9px 0; }
.diagnostic-box ul { margin: 7px 0; padding-left: 18px; color: var(--ink-2); font-size: 12px; }
.diagnostic-box small { color: var(--muted); }

/* Exam shell */
.exam-screen { min-height: 100vh; background: #f3f5f5; color: #1c262b; display: grid; grid-template-rows: 66px auto minmax(0, 1fr) 70px; }
.exam-topbar { background: #006a70; color: white; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 25px; box-shadow: 0 1px 0 rgba(0,0,0,.15); position: relative; z-index: 10; }
.exam-brand { display: flex; align-items: center; gap: 9px; font-size: 13px; }
.exam-brand-mark { width: 28px; height: 28px; border: 1px solid rgba(255,255,255,.7); border-radius: 5px; display: grid; place-items: center; font-family: Georgia, serif; font-size: 18px; font-weight: 900; }
.exam-section { text-align: center; display: grid; line-height: 1.2; }
.exam-section span { font-size: 10px; opacity: .78; letter-spacing: .06em; }
.exam-section strong { font-size: 13px; }
.exam-tools { display: flex; justify-content: flex-end; height: 100%; }
.exam-tools button { min-width: 82px; border: 0; border-left: 1px solid rgba(255,255,255,.17); background: transparent; color: white; padding: 0 14px; display: flex; justify-content: center; align-items: center; gap: 7px; }
.exam-tools button:hover { background: rgba(255,255,255,.08); }
.exam-tools .icon { width: 17px; height: 17px; }
.timer-copy { display: grid; text-align: left; line-height: 1.1; }
.timer-copy small { font-size: 8px; opacity: .75; }
.timer-copy b { font-variant-numeric: tabular-nums; font-size: 14px; }
.timer-copy b.warning { color: #ffe07c; }
.exam-instructions { min-height: 56px; background: white; border-bottom: 1px solid #cfd6d8; padding: 10px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.exam-instructions > div { display: grid; }
.exam-instructions strong { font-size: 14px; }
.exam-instructions span { font-size: 11px; color: #657278; }
.exam-instructions button { border: 0; background: transparent; color: #006a70; font-weight: 700; font-size: 11px; }
.exam-main { min-height: 0; overflow: auto; padding: 36px clamp(24px, 5vw, 76px); }
.exam-footer { min-height: 70px; background: white; border-top: 1px solid #ccd4d6; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 28px; position: relative; z-index: 5; }
.exam-footer > div:last-child { justify-self: end; }
.exam-footer-status { color: #69767c; font-size: 11px; }
.exam-nav-button { min-height: 42px; min-width: 102px; border-radius: 5px; padding: 8px 15px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-weight: 750; }
.exam-nav-button.primary { background: #006a70; border: 1px solid #006a70; color: white; }
.exam-nav-button.secondary { background: white; border: 1px solid #aeb9bd; color: #263238; }
.exam-nav-button:disabled { opacity: .38; cursor: not-allowed; }
.exam-nav-button .icon { width: 15px; height: 15px; }
.answer-progress b { color: #006a70; }

/* CTW exam */
.ctw-main { display: grid; place-items: start center; }
.ctw-paper { width: min(990px, 100%); background: white; border: 1px solid #d5dcde; box-shadow: 0 4px 16px rgba(20,38,42,.06); padding: 36px 44px 44px; }
.ctw-question-label { color: #67767b; font-size: 11px; font-weight: 750; border-bottom: 1px solid #e1e5e6; padding-bottom: 12px; margin-bottom: 22px; }
.ctw-passage { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(18px, 1.65vw, 21px); line-height: 2.05; margin: 0; letter-spacing: .002em; }
.ctw-gap { white-space: nowrap; display: inline-flex; align-items: baseline; margin: 0 1px; }
.ctw-prefix { display: inline; }
.ctw-gap input {
  width: calc(var(--letters) * .72em + 13px); min-width: 27px; height: 1.58em; margin: 0 2px; padding: 0 4px 1px;
  border: 0; border-bottom: 2px solid #617377; border-radius: 2px 2px 0 0; background: #e8ecec;
  color: #172326; font-family: Georgia, 'Times New Roman', serif; font-size: .94em; letter-spacing: .02em; line-height: 1; text-align: left;
}
.ctw-gap input:focus { background: #fff9d9; border-bottom-color: #006a70; outline: 2px solid rgba(0,106,112,.22); outline-offset: 1px; }

/* Build exam */
.build-main { display: grid; grid-template-rows: minmax(0,1fr) auto; place-items: start center; gap: 22px; }
.build-card { width: min(1020px, 100%); background: white; border: 1px solid #d5dcde; box-shadow: 0 4px 16px rgba(20,38,42,.06); padding: 30px 34px; }
.dialogue-row { display: grid; grid-template-columns: auto 1fr; gap: 13px; align-items: start; margin-bottom: 14px; }
.speaker-avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: white; font-weight: 850; box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
.speaker-a { background: #607d8b; }
.speaker-b { background: #167b83; }
.speech-bubble { border: 1px solid #d8dee0; background: #f9fafa; border-radius: 5px; padding: 12px 15px; min-height: 62px; }
.speech-bubble > span { color: #718087; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; font-weight: 750; }
.speech-bubble p { margin: 4px 0 0; font-size: 16px; }
.answer-row { margin-top: 20px; }
.answer-bubble { background: white; padding: 18px 15px 22px; }
.sentence-builder { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 7px; margin-top: 11px; min-height: 56px; font-size: 16px; }
.fixed-text { padding-bottom: 10px; font-weight: 600; }
.fixed-text:empty { display: none; }
.sentence-slots { display: contents; }
.sentence-slot { min-width: 76px; min-height: 42px; border: 0; border-bottom: 2px solid #89979b; border-radius: 3px 3px 0 0; background: #edf0f0; padding: 7px 10px; font-weight: 650; }
.sentence-slot > span { display: block; width: 42px; }
.sentence-slot.filled { background: #e3f3f2; border-bottom-color: #08737c; }
.sentence-slot.drag-over { background: #fff2c7; box-shadow: 0 0 0 2px #d99700; }
.tile-area { border-top: 1px solid #dfe4e5; margin-top: 30px; padding-top: 20px; }
.tile-instruction { color: #718087; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; font-weight: 750; margin-bottom: 10px; }
.word-tiles { display: flex; flex-wrap: wrap; gap: 9px; }
.word-tile { border: 1px solid #9eabad; background: white; border-radius: 5px; padding: 9px 13px; min-height: 39px; box-shadow: 0 1px 2px rgba(20,38,42,.08); font-weight: 600; }
.word-tile:hover { border-color: #006a70; background: #f4fbfb; }
.word-tile.used { opacity: .24; box-shadow: none; }
.question-map { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.question-dot { width: 34px; height: 34px; border: 1px solid #aeb9bd; background: white; border-radius: 4px; font-size: 11px; }
.question-dot.answered { border-color: #25876d; position: relative; }
.question-dot.answered::after { content: ''; position: absolute; width: 5px; height: 5px; background: #25876d; border-radius: 50%; right: 3px; top: 3px; }
.question-dot.current { background: #006a70; color: white; border-color: #006a70; }
.question-dot.current::after { background: white; }

/* Extended writing exam */
.split-writing-main { padding: 0; display: grid; grid-template-columns: minmax(330px, 46%) minmax(430px, 54%); overflow: hidden; }
.prompt-pane, .editor-pane { min-height: 0; overflow: auto; background: white; }
.prompt-pane { border-right: 1px solid #cdd5d7; padding: 30px 34px 42px; }
.editor-pane { padding: 25px 28px 34px; display: flex; flex-direction: column; }
.task-kicker { color: #006a70; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; font-weight: 850; border-bottom: 1px solid #dfe4e5; padding-bottom: 10px; margin-bottom: 18px; }
.prompt-pane p, .prompt-pane li { font-size: 14px; line-height: 1.62; }
.prompt-pane ul { padding-left: 20px; }
.prompt-pane li { margin-bottom: 7px; }
.scenario-visual { min-height: 88px; border: 1px solid #d3dcde; border-radius: 6px; display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 13px; padding: 12px; background: #f6f9f9; margin-bottom: 20px; }
.visual-date { width: 57px; height: 57px; border-radius: 4px; background: #006a70; color: white; display: grid; place-items: center; text-align: center; font-size: 12px; font-weight: 900; }
.visual-copy { display: grid; }
.visual-copy strong { font-size: 13px; }
.visual-copy span { color: #69777c; font-size: 10px; }
.visual-status { color: #b03b43; background: #fff0f1; border: 1px solid #f0c5c8; border-radius: 4px; padding: 6px 8px; font-size: 9px; font-weight: 900; letter-spacing: .05em; }
.email-fields { border: 1px solid #cbd4d6; border-radius: 5px 5px 0 0; overflow: hidden; }
.email-fields div { display: grid; grid-template-columns: 78px 1fr; min-height: 38px; border-bottom: 1px solid #dce2e4; align-items: center; }
.email-fields div:last-child { border-bottom: 0; }
.email-fields span { height: 100%; display: flex; align-items: center; padding-left: 12px; background: #f3f5f5; color: #66757a; font-size: 11px; }
.email-fields strong { padding: 0 12px; font-size: 12px; }
.editor-toolbar { min-height: 43px; background: #eef1f2; border: 1px solid #cbd4d6; border-top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 7px; }
.editor-toolbar > div { display: flex; align-items: center; gap: 3px; }
.editor-toolbar button { border: 0; background: transparent; min-height: 30px; padding: 5px 9px; border-radius: 3px; color: #364349; font-size: 10px; }
.editor-toolbar button:hover { background: white; }
.toolbar-divider { width: 1px; height: 20px; background: #c8d0d2; margin: 0 3px; }
.writing-editor { flex: 1; min-height: 280px; width: 100%; resize: none; border: 1px solid #9eabad; border-top: 0; border-radius: 0; padding: 16px; font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.55; color: #152126; }
.writing-editor:focus { outline: 2px solid rgba(0,106,112,.22); outline-offset: -2px; }
.word-count { border: 1px solid #cbd4d6; border-top: 0; min-height: 30px; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; color: #67757a; font-size: 10px; }
.word-count.hidden { visibility: hidden; }
.discussion-layout .prompt-pane { padding-top: 25px; }
.discussion-context-pane .task-kicker { margin-top: 16px; }
.discussion-response-pane { padding-top: 18px; }
.discussion-peer-list { margin: -4px 0 12px; border-bottom: 1px solid #cbd4d6; }
.discussion-peer-list .discussion-post:last-child { border-bottom: 0; }
.course-header { border-bottom: 1px solid #dfe4e5; padding-bottom: 11px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.course-header span { color: #6d7b80; font-size: 10px; }
.course-header strong { color: #006a70; font-size: 13px; }
.discussion-post { border-bottom: 1px solid #e0e5e6; padding: 14px 0; display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.post-avatar { width: 35px; height: 35px; border-radius: 50%; display: grid; place-items: center; background: #dfe9ea; color: #31565a; font-weight: 850; }
.post-avatar.professor { background: #006a70; color: white; }
.discussion-post strong { font-size: 12px; }
.discussion-post p { margin: 4px 0 0; color: #344247; font-size: 13px; }
.professor-post { background: #f6f9f9; margin: 0 -12px; padding: 14px 12px; border-radius: 5px; }
.minimum-note { color: #68767b; font-size: 10px !important; background: #f4f6f6; padding: 8px 10px; border-radius: 4px; }
.discussion-editor { min-height: 270px; border-top: 1px solid #9eabad; }

/* Modal and grading */
.modal-backdrop, .grading-overlay { position: fixed; inset: 0; background: rgba(6, 23, 27, .55); display: grid; place-items: center; z-index: 100; padding: 20px; }
.help-modal { width: min(520px, 100%); background: white; border-radius: 8px; padding: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.25); position: relative; }
.help-modal h2 { margin: 0 0 10px; font-size: 22px; }
.help-modal p, .help-modal li { color: #45545a; }
.help-modal ul { padding-left: 19px; }
.modal-close { position: absolute; right: 14px; top: 14px; border: 0; background: transparent; width: 32px; height: 32px; display: grid; place-items: center; }
.grading-card { background: white; border-radius: 9px; padding: 28px; width: min(390px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.grading-card span { color: #68767b; font-size: 12px; }
.spinner { width: 34px; height: 34px; border: 3px solid #d9e4e4; border-top-color: #006a70; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast-region { position: fixed; right: 22px; bottom: 22px; z-index: 300; }
.toast { background: #17282c; color: white; border-radius: 9px; padding: 11px 15px; box-shadow: var(--shadow-md); font-size: 12px; max-width: 360px; }
.toast-warning { background: #7d4a00; }
.toast-error { background: #8f2d35; }

@media (max-width: 1050px) {
  :root { --sidebar: 215px; }
  .app-content { width: min(100% - 38px, 1180px); }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .word-grid { grid-template-columns: repeat(2, 1fr); }
  .split-writing-main { grid-template-columns: 43% 57%; }
  .prompt-pane { padding: 25px 24px; }
}

@media (max-width: 800px) {
  .app-layout { display: block; }
  .app-sidebar { display: none; }
  .app-mobile-header { height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 17px; background: white; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .brand-lockup.compact .brand-mark { width: 31px; height: 31px; font-size: 18px; }
  .mobile-nav-select { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: white; }
  .app-content { width: min(100% - 28px, 720px); padding: 28px 0 50px; }
  .page-heading { align-items: flex-start; flex-direction: column; }
  .page-actions { justify-content: flex-start; }
  .hero-grid, .practice-grid, .dashboard-grid, .settings-grid, .vocab-scope { grid-template-columns: 1fr; }
  .wide-card { grid-column: auto; }
  .word-grid { grid-template-columns: 1fr; }
  .quality-grid { grid-template-columns: repeat(2, 1fr); }
  .vocab-toolbar { align-items: stretch; flex-direction: column; }
  .search-field { min-width: 0; }
  .result-score-grid { grid-template-columns: repeat(2,1fr); }

}

@media (max-width: 560px) {
  .page-heading h1 { font-size: 30px; }
  .hero-card { min-height: 360px; }
  .hero-card-footer { align-items: stretch; flex-direction: column; }
  .hero-card-footer .button { width: 100%; }
  .stats-grid, .mode-toggle, .result-score-grid, .form-grid.two, .quality-grid { grid-template-columns: 1fr; }
  .resume-banner { grid-template-columns: auto 1fr; }
  .resume-actions { grid-column: 1 / -1; }
  .resume-actions .button { flex: 1; }
  .cefr-track { grid-template-columns: repeat(3,1fr); border-radius: 10px; }
}

@media print {
  .app-sidebar, .app-mobile-header, .page-actions, .review-actions, .bookmark-button { display: none !important; }
  .app-layout { display: block; }
  .app-content { width: 100%; padding: 0; }
  .panel, .result-score-grid article { box-shadow: none; }
}

/* v3 analytics + spaced review */
.skill-list { display:grid; gap:9px; margin-top:12px; }
.skill-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
.skill-row:last-child { border-bottom:0; }
.skill-row strong { font-size:13px; }
.skill-row span { color:var(--muted); font-size:11px; }
.dimension-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin:9px 0 11px; }
.dimension-grid > span { border:1px solid var(--line); border-radius:7px; padding:7px 8px; display:grid; gap:3px; background:var(--surface-2); }
.dimension-grid small { text-transform:capitalize; color:var(--muted); font-size:9px; }
.dimension-grid b { font-size:12px; }
.review-meta { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:10px; padding-top:8px; margin-top:8px; border-top:1px solid var(--line); }
.review-buttons { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:8px; }
.review-buttons button { min-height:34px; border:1px solid var(--line); border-radius:6px; background:var(--surface); font-size:10px; font-weight:700; }
.review-buttons button:hover { border-color:var(--accent); }
.due-tag { color:#805400 !important; background:#fff4ce !important; border-color:#efd896 !important; }
.due-word { border-color:#d8b75b; }

/* v3 exam fidelity: neutral, flat testing surface */
.exam-screen { font-family:Arial,Helvetica,sans-serif; background:#f5f6f6; }
.exam-topbar { min-height:58px; box-shadow:none; }
.exam-instructions { min-height:48px; padding-top:7px; padding-bottom:7px; }
.exam-main { padding-top:28px; padding-bottom:28px; }
.ctw-paper { width:min(1040px,100%); border:0; box-shadow:none; padding:30px 34px 36px; }
.ctw-question-label { margin-bottom:18px; }
.ctw-passage { font-family:Arial,Helvetica,sans-serif; font-size:clamp(17px,1.45vw,19px); line-height:1.72; letter-spacing:0; }
.ctw-gap input { width:calc(var(--letters) * .62em + 11px); min-width:25px; height:1.45em; margin:0 2px; padding:0 3px; border:1px solid #bbc2c4; border-radius:1px; background:#dfe2e2; color:#142126; font-family:Arial,Helvetica,sans-serif; font-size:.92em; letter-spacing:.01em; line-height:1.1; }
.ctw-gap input:focus { background:#fff7cc; border-color:#006a70; outline:2px solid rgba(0,106,112,.2); outline-offset:0; }
.build-card { width:min(1040px,100%); border:0; box-shadow:none; padding:27px 31px 30px; }
.speaker-avatar { box-shadow:none; }
.speech-bubble { background:#fbfbfb; }
.word-tile { box-shadow:none; border-radius:3px; font-weight:600; }
.word-tile.selected { border:2px solid #006a70; background:#e8f5f4; padding:8px 12px; }

/* v3 question generator workflow */
.generator-panel{margin-top:18px}.generator-panel .panel-heading{align-items:flex-start}.generator-panel .panel-heading p{max-width:760px;margin:6px 0 0;color:var(--muted);line-height:1.55}.generator-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.generator-actions .button{min-width:220px}.generation-message{margin-top:12px;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:13px;line-height:1.5}.build-selection-status{margin-top:10px;color:var(--muted);font-size:13px}.word-tile.selected{outline:3px solid color-mix(in srgb,var(--teal,#107d80) 28%,transparent);outline-offset:2px}.button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:640px){.generator-actions{display:grid}.generator-actions .button{min-width:0;width:100%}}

  width: min(470px, 100%);

  grid-template-columns: 44px 1fr;

  row-gap: 20px;
  align-items: start;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, .28);
}

  width: 40px;

  color: var(--teal-900);

.confirm-copy p { margin: 0; color: var(--ink-2); line-height: 1.55; }

}

.content-kpi strong { font-size:28px; align-self:center; }
.content-kpi small { color:var(--muted); font-size:10px; align-self:end; }
.content-grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(290px,.65fr); gap:16px; margin-bottom:16px; }
.coverage-list { display:grid; gap:14px; }
.coverage-meter { border:1px solid var(--line); border-radius:12px; padding:14px; background:#fbfcfc; }
.coverage-meter-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:9px; }
.coverage-meter-head > div { display:grid; }
.coverage-meter-head strong { font-size:14px; }
.coverage-meter-head span { color:var(--muted); font-size:10px; }
.coverage-meter-head b { color:var(--teal-800); }
.coverage-track { height:7px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
.coverage-track i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--teal-700),#32a395); }
.coverage-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
.coverage-tags span { border-radius:6px; padding:3px 6px; font-size:9px; font-weight:700; }
.coverage-tags .covered { background:var(--success-soft); color:var(--success); }
.coverage-tags .missing { background:var(--warning-soft); color:var(--warning); }
.content-policy-panel { align-self:start; }
.policy-rule { border-left:4px solid; border-radius:8px; padding:12px 13px; margin-bottom:10px; }
.policy-rule b { display:block; font-size:12px; }
.policy-rule p { margin:4px 0 0; font-size:11px; color:var(--ink-2); }
.policy-rule.allow { border-color:var(--success); background:var(--success-soft); }
.policy-rule.deny { border-color:var(--danger); background:var(--danger-soft); }
.lifecycle-list { list-style:none; padding:0; margin:18px 0 0; display:grid; }
.lifecycle-list li { display:grid; grid-template-columns:76px 1fr; gap:8px; padding:9px 0; border-top:1px solid var(--line); }
.lifecycle-list li b { color:var(--teal-800); font-size:11px; text-transform:uppercase; }
.lifecycle-list li span { color:var(--muted); font-size:11px; }
.source-registry-panel { margin-bottom:16px; }
.source-table { width:100%; border-collapse:collapse; min-width:760px; }
.source-table th,.source-table td { text-align:left; padding:11px 12px; border-top:1px solid var(--line); vertical-align:top; font-size:11px; }
.source-table th { color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-size:9px; }
.source-table td:first-child strong,.source-table td:first-child small { display:block; }
.source-table td:first-child small { color:var(--muted); margin-top:2px; }
.source-license { border-radius:999px; background:var(--surface-2); padding:4px 7px; font-size:9px; font-weight:800; }
.text-link { color:var(--teal-700); font-weight:750; text-decoration:none; white-space:nowrap; }
.measurement-note { margin-top:0; }
.focused-topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
.focused-layout { display:grid; grid-template-columns:minmax(320px,.8fr) minmax(0,1.2fr); gap:16px; align-items:start; }
.focused-stimulus { position:sticky; top:20px; }
.focused-stimulus-meta { display:flex; justify-content:space-between; gap:10px; color:var(--teal-700); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
.focused-stimulus-meta b { color:var(--success); }
.focused-stimulus h2 { margin:14px 0 18px; font-size:24px; }
.focused-stimulus-text { font:16px/1.75 Georgia,'Times New Roman',serif; white-space:normal; color:#26383d; }
.focused-question-list { display:grid; gap:12px; }
.focused-question { background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-sm); }
.focused-question.answered-correct { border-left:4px solid var(--success); }
.focused-question.answered-wrong { border-left:4px solid var(--danger); }
.focused-question-head { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
.focused-question-head b { color:var(--teal-700); }
.focused-question h3 { margin:10px 0 16px; font-size:17px; line-height:1.45; }
.focused-options { display:grid; gap:8px; }
.focused-option { display:grid; grid-template-columns:18px 30px minmax(0,1fr); gap:9px; align-items:start; border:1px solid var(--line-strong); border-radius:9px; padding:11px 12px; cursor:pointer; }
.focused-option:hover { background:var(--surface); }
.focused-option:has(input:checked) { border-color:var(--teal-700); background:var(--teal-50); }
.focused-option.correct { border-color:var(--success); background:var(--success-soft); }
.focused-option.incorrect { border-color:var(--danger); background:var(--danger-soft); }
.focused-option input { width:16px; height:16px; margin:3px 0 0; accent-color:var(--teal-700); }
.focused-explanation { border-top:1px solid var(--line); margin-top:14px; padding-top:12px; }
.focused-explanation strong { color:var(--success); font-size:12px; }
.focused-explanation p { color:var(--ink-2); margin:4px 0 0; font-size:12px; }
.focused-actions { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-top:16px; }
.focused-actions > div:first-child { display:grid; }
.focused-actions > div:last-child { display:flex; gap:8px; }
.focused-actions strong { font-size:17px; }
.focused-actions span { color:var(--muted); font-size:11px; }

@media (max-width: 1080px) {
  .content-kpi-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .content-grid { grid-template-columns:1fr; }
}
@media (max-width: 800px) {
  .content-hero { grid-template-columns:1fr; }
  .content-score-ring { width:110px; height:110px; }
  .content-kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .focused-layout { grid-template-columns:1fr; }
  .focused-stimulus { position:static; }
  .focused-actions { align-items:flex-start; flex-direction:column; }
  .focused-actions > div:last-child { width:100%; }
  .focused-actions .button { flex:1; }
}
@media (max-width: 480px) {
  .content-kpi-grid { grid-template-columns:1fr; }
  .content-kpi { min-height:96px; }
  .focused-topbar { align-items:flex-start; flex-direction:column; }
  .focused-question { padding:16px; }
  .focused-option { grid-template-columns:17px 25px minmax(0,1fr); padding:10px; font-size:14px; }
  .card-action-pair { grid-template-columns:1fr; }
}
.targeted-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
@media (max-width:800px){.targeted-actions{width:100%;}.targeted-actions .button{flex:1 1 150px;}}
</style>

  text: `For much of the twentieth century, many cities treated small streams mainly as drainage channels. Engineers straightened them, covered them with concrete, or placed them underground so rainwater could leave developed areas quickly. These changes reduced local flooding in some places, but they also removed habitat and caused water to travel downstream with greater force. As a result, communities located farther along the watershed sometimes experienced more erosion and sudden flooding.\n\nRecent restoration projects take a different approach. Instead of forcing water through a narrow channel, planners may reconnect a stream to parts of its former floodplain. During heavy rain, water can spread temporarily across planted areas, slowing its movement and allowing some of it to enter the soil. Designers also add rocks, bends, and native vegetation to create varied conditions for fish and insects. Restoration does not mean returning a stream to an untouched historical state; roads and buildings often make that impossible. Rather, the goal is to recover selected ecological functions while still protecting nearby property. Because each watershed has different constraints, successful projects require long-term monitoring rather than a single standard design.`,

function sourceById(id) {
  return OFFICIAL_SOURCE_REGISTRY.find((source) => source.id === id) || null;
}

function validateSourceRegistry(sources = OFFICIAL_SOURCE_REGISTRY) {
  const errors = [];
  const ids = new Set();
  for (const source of sources) {
    if (!source.id || !source.title || !source.url) errors.push('Every source needs id, title, and URL.');
    if (ids.has(source.id)) errors.push(`Duplicate source id: ${source.id}`);
    ids.add(source.id);
    if (source.publisher !== 'ETS' && source.publisher !== 'ETS Research') errors.push(`${source.id}: official registry accepts ETS sources only.`);
    if (!Array.isArray(source.allowedUses) || !source.allowedUses.length) errors.push(`${source.id}: allowedUses missing.`);
    if (!Array.isArray(source.prohibitedUses) || !source.prohibitedUses.includes('public-republication')) errors.push(`${source.id}: republication policy missing.`);
  }
  return { valid: errors.length === 0, errors };
}

/* src/ctest.js */
const WORD_RE = /[A-Za-z]+(?:[’'][A-Za-z]+)?/g;

function countWords(text) {
  return (String(text).match(WORD_RE) || []).length;
}

function splitFirstSentence(text) {
  const normalized = String(text || '').replace(/\s+/g, ' ').trim();
  const match = normalized.match(/^.*?[.!?](?=\s|$)/);
  if (!match) throw new Error('C-test passage needs a complete first sentence ending in punctuation.');
  return { firstSentence: match[0], remainder: normalized.slice(match[0].length) };
}

function defaultTargets(requiredGaps) {
  return Array.from({ length: requiredGaps }, (_, index) => (index + 1) * 2);
}

function validateTargets(targets, requiredGaps) {
  if (!Array.isArray(targets) || targets.length !== requiredGaps) {
    throw new Error(`C-test needs exactly ${requiredGaps} target lexical positions.`);
  }
  if (targets.some((value) => !Number.isInteger(value) || value < 1)) {
    throw new Error('C-test target lexical positions must be positive integers.');
  }
  if (new Set(targets).size !== targets.length) throw new Error('C-test target lexical positions must be unique.');
  return [...targets].sort((a, b) => a - b);
}

function splitWord(word) {
  if (!/^[A-Za-z]{2,}$/.test(word)) {
    throw new Error(`Unsafe C-test target word “${word}”. Regenerate or explicitly curate the source text; do not silently skip a target.`);
  }
  const visibleLength = Math.floor(word.length / 2);
  return { visible: word.slice(0, visibleLength), answer: word.slice(visibleLength) };
}

function createCtest(sourceText, {
  requiredGaps = 10,
  targetLexicalPositions = null,
  targetPolicy = targetLexicalPositions ? 'curated' : 'canonical-every-second-word',
  idPrefix = 'gap'
} = {}) {
  const normalized = String(sourceText || '').replace(/\s+/g, ' ').trim();
  const { firstSentence, remainder } = splitFirstSentence(normalized);
  const targets = validateTargets(targetLexicalPositions || defaultTargets(requiredGaps), requiredGaps);
  const targetSet = new Set(targets);
  const segments = [{ type: 'text', text: firstSentence }];
  const gaps = [];
  let lexicalPosition = 0;
  let cursor = 0;
  WORD_RE.lastIndex = 0;
  for (const match of remainder.matchAll(WORD_RE)) {
    const word = match[0];
    const index = match.index ?? 0;
    if (index > cursor) segments.push({ type: 'text', text: remainder.slice(cursor, index) });
    lexicalPosition += 1;
    if (targetSet.has(lexicalPosition)) {
      const { visible, answer } = splitWord(word);
      const gap = {
        id: `${String(idPrefix || 'gap').replace(/[^A-Za-z0-9_-]/g, '-')}-${gaps.length + 1}`,
        number: gaps.length + 1,
        lexicalPosition,
        word,
        visible,
        answer,
        visibleLength: visible.length,
        missingLength: answer.length
      };
      gaps.push(gap);
      segments.push({ type: 'gap', ...gap });
    } else {
      segments.push({ type: 'text', text: word });
    }
    cursor = index + word.length;
  }
  if (cursor < remainder.length) segments.push({ type: 'text', text: remainder.slice(cursor) });
  if (gaps.length !== requiredGaps) throw new Error(`Expected ${requiredGaps} truncated words but generated ${gaps.length}.`);
  return {
    sourceText: normalized,
    firstSentence,
    remainder,
    segments,
    gaps,
    wordCount: countWords(normalized),
    targetPolicy,
    targetLexicalPositions: targets
  };
}

function reconstructCtest(ctest) {
  return ctest.segments.map((segment) => segment.type === 'gap' ? `${segment.visible}${segment.answer}` : segment.text).join('').replace(/\s+/g, ' ').trim();
}

function normalizeGapAnswer(value) {
  return String(value ?? '').trim().replace(/[’]/g, "'").toLowerCase();
}

function gradeCtest(ctest, answers = {}) {
  const details = ctest.gaps.map((gap) => {
    const response = String(answers[gap.id] ?? '').trim();
    const correct = normalizeGapAnswer(response) === normalizeGapAnswer(gap.answer);
    return { ...gap, response, correct };
  });
  return { score: details.filter((item) => item.correct).length, maxScore: details.length, details, unanswered: details.filter((item) => !item.response).length };
}

function validateCtestPassage(sourceText, options = {}) {
  const warnings = [];
  const errors = [];
  let ctest = null;
  try {
    ctest = createCtest(sourceText, options);
  } catch (error) {
    errors.push(error instanceof Error ? error.message : String(error));
    return { valid: false, errors, warnings, ctest };
  }
  if (ctest.wordCount < 70 || ctest.wordCount > 100) errors.push(`Complete the Words passage must contain about 70–100 words; received ${ctest.wordCount}.`);
  const properNouns = (ctest.sourceText.match(/(?<![.!?]\s)(?<!^)[A-Z][a-z]+/g) || []).length;
  if (properNouns > 5) warnings.push('The passage may contain too many proper nouns for an accessible C-test.');
  if (reconstructCtest(ctest) !== ctest.sourceText) errors.push('The generated C-test does not reconstruct to the original passage exactly.');
  return { valid: errors.length === 0, errors, warnings, ctest };
}
