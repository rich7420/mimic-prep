const PURPOSE_PATTERNS = [
  ['request', /\bask\b|\brequest\b|could you|would you|please|need .* help/i],
  ['give-information', /explain|describe|inform|let .* know|provide .* information/i],
  ['status-inquiry', /status|whether|when .* available|follow up|update/i],
  ['recommendation', /recommend|suggest|advice/i],
  ['invitation', /invite|join|attend|participate/i],
  ['problem-solution', /problem|issue|restore|replace|alternative|resolve|solution|fix/i],
  ['explanation', /explain|reason|because|why/i]
];

function tokens(text) {
  return (String(text || '').toLowerCase().match(TOKEN_RE) || []).map((token) => token.replace('’', "'"));
}

function unique(values) {
  return [...new Set(values.filter(Boolean))];
}

function normalizeLabel(value) {
  return String(value || '').trim().toLowerCase().replace(/[–—]/g, '-').replace(/\s+/g, '-');
}

function normalizeDailyFormat(value) {
  const key = normalizeLabel(value);
  return DAILY_FORMAT_ALIASES[key] || key || 'unknown';
}

function canonicalAcademicDomain(value) {
  const text = String(value || '');
  const hits = ACADEMIC_DOMAIN_ALIASES.filter(([pattern]) => pattern.test(text)).map(([, domain]) => domain);
  return hits[0] || 'unclassified';
}

function normalizeSkill(value) {
  const key = normalizeLabel(value);
  return SKILL_ALIASES[key] || key || 'unclassified';
}

function normalizeBuildGrammar(value) {
  const text = String(value || '');
  for (const [pattern, label] of BUILD_GRAMMAR_ALIASES) if (pattern.test(text)) return label;
  return normalizeLabel(text) || 'unclassified';
}

function estimatePartOfSpeech(word) {
  const value = String(word || '').toLowerCase();
  if (/ly$/.test(value)) return 'adverb';
  if (/(tion|sion|ment|ness|ity|ance|ence|ship|ism|age|ery|al)$/.test(value)) return 'noun';
  if (/(ous|ive|able|ible|ful|less|ic|ical|ary|ory|ent|ant)$/.test(value)) return 'adjective';
  if (/(ize|ise|ify|ate|en)$/.test(value)) return 'verb';
  if (/(ed|ing)$/.test(value)) return 'verb-or-adjective';
  return 'other';
}

function textFingerprint(text, n = 5) {
  const list = tokens(text);
  const grams = new Set();
  for (let index = 0; index <= list.length - n; index += 1) grams.add(list.slice(index, index + n).join(' '));
  return grams;
}

function jaccard(left, right) {
  if (!left.size && !right.size) return 0;
  let intersection = 0;
  for (const value of left) if (right.has(value)) intersection += 1;
  return intersection / Math.max(1, left.size + right.size - intersection);
}

function itemText(type, item) {
  if (type === 'ctw') return item.sourceText || '';
  if (type === 'daily' || type === 'academic') return [item.title, item.label, item.text, ...(item.questions || []).map((question) => `${question.stem} ${(question.options || []).map((option) => option.text).join(' ')}`)].join(' ');
  if (type === 'build') return (item.items || []).map((question) => [question.promptA, question.prefix, question.suffix, ...(question.choices || []).map((choice) => choice.text)].join(' ')).join(' ');
  if (type === 'email') return [item.title, item.setting, item.scenario, ...(item.goals || [])].join(' ');
  if (type === 'discussion') return [item.course, item.question, ...(item.students || []).map((student) => student.post)].join(' ');
  return JSON.stringify(item || {});
}

function contentFingerprint(type, item) {
  return textFingerprint(itemText(type, item));
}

function validateProvenance(item = {}) {
  const provenance = item.provenance?.kind || item.provenance || 'original';
  const errors = [];
  const warnings = [];
  if (SOURCE_POLICY.prohibitedProvenance.includes(provenance)) errors.push(`Prohibited item provenance: ${provenance}.`);
  if (!SOURCE_POLICY.allowedProvenance.includes(provenance)) warnings.push(`Unrecognized provenance “${provenance}”; human review is required.`);
  if (provenance === 'original' && item.provenance && typeof item.provenance === 'object') {
    if (item.provenance.operationalItem === true || item.provenance.leaked === true || item.provenance.recalled === true) {
      errors.push('Original provenance conflicts with an operational, leaked, or recalled-item flag.');
    }
  }
  return { valid: errors.length === 0, provenance, errors, warnings };
}

function analyzeCtw(set) {
  const options = {
    targetLexicalPositions: set.targetLexicalPositions || null,
    targetPolicy: set.targetPolicy || (set.targetLexicalPositions ? 'curated' : 'canonical-every-second-word')
  };
  const validation = validateCtestPassage(set.sourceText, options);
  const source = String(set.sourceText || '');
  const sourceTokens = source.match(TOKEN_RE) || [];
  const sentences = source.match(SENTENCE_RE) || [];
  const capitalizedInsideSentence = (source.match(/(?<!^)(?<![.!?]\s)[A-Z][a-z]+/g) || []).length;
  const dialogueDetected = /(^|\s)[“"][^”"]+[”"]|\b(said|asked|replied|told)\b.{0,30}[“"]/i.test(source);
  const chatDetected = /(^|\n)\s*(from|to|subject|[A-Z][A-Za-z ]{0,20}:)\s/i.test(source);
  const longWordRatio = sourceTokens.length ? sourceTokens.filter((word) => word.length >= 13).length / sourceTokens.length : 0;
  const targetPos = validation.ctest ? validation.ctest.gaps.map((gap) => estimatePartOfSpeech(gap.word)) : [];
  const warnings = [...validation.warnings];
  if (sentences.length < 3) warnings.push('CTW passage has fewer than three complete sentences; coherence should be reviewed.');
  if (capitalizedInsideSentence > 5) warnings.push('CTW passage may rely on too many proper nouns.');
  if (dialogueDetected || chatDetected) warnings.push('CTW passage appears to contain dialogue, chat, or message formatting.');
  if (longWordRatio > 0.08) warnings.push('CTW passage contains an unusually high share of very long words; check jargon load.');
  const provenance = validateProvenance(set);
  return {
    id: set.id,
    valid: validation.valid && provenance.valid,
    errors: [...validation.errors, ...provenance.errors],
    warnings: [...warnings, ...provenance.warnings],
    wordCount: validation.ctest?.wordCount ?? countWords(source),
    sentenceCount: sentences.length,
    gapCount: validation.ctest?.gaps.length || 0,
    targetPolicy: options.targetPolicy,
    targetPartOfSpeech: targetPos,
    targetPartOfSpeechCoverage: unique(targetPos),
    properNounEstimate: capitalizedInsideSentence,
    dialogueDetected: dialogueDetected || chatDetected,
    longWordRatio: Number(longWordRatio.toFixed(3)),
    domain: set.domain || 'Unclassified',
    level: set.level || 'Unclassified',
    provenance: provenance.provenance
  };
}

function validateMcqQuestion(question, context) {
  const errors = [];
  const warnings = [];
  if (!question?.id || !question?.stem) errors.push(`${context}: question needs an id and stem.`);
  if (!Array.isArray(question?.options) || question.options.length !== 4) errors.push(`${context}: question needs exactly four options.`);
  const ids = (question?.options || []).map((option) => option.id);
  if (new Set(ids).size !== ids.length) errors.push(`${context}: option IDs must be unique.`);
  if (!ids.includes(question?.answer)) errors.push(`${context}: answer must match an option ID.`);
  if (!question?.skill) warnings.push(`${context}: skill tag is missing.`);
  return { errors, warnings };
}

function analyzeDaily(stimulus) {
  const blueprint = TASK_BLUEPRINTS.daily.constraints;
  const errors = [];
  const warnings = [];
  const wordCountValue = countWords(stimulus.text || '');
  const format = normalizeDailyFormat(stimulus.type || stimulus.format);
  const questionCount = Array.isArray(stimulus.questions) ? stimulus.questions.length : 0;
  if (!stimulus?.id || !stimulus?.title || !stimulus?.text) errors.push('Daily Life stimulus needs id, title, and text.');
  if (wordCountValue < blueprint.wordCount[0] || wordCountValue > blueprint.wordCount[1]) errors.push(`Daily Life stimulus must contain ${blueprint.wordCount[0]}–${blueprint.wordCount[1]} words; received ${wordCountValue}.`);
  if (!blueprint.questionsPerStimulus.includes(questionCount)) errors.push(`Daily Life stimulus needs 2 or 3 questions; received ${questionCount}.`);
  if (!blueprint.formats.includes(format)) warnings.push(`Daily Life format “${format}” is outside the public format list.`);
  const skills = [];
  for (const question of stimulus.questions || []) {
    const result = validateMcqQuestion(question, `${stimulus.id}/${question.id || 'question'}`);
    errors.push(...result.errors);
    warnings.push(...result.warnings);
    skills.push(normalizeSkill(question.skill));
  }
  const provenance = validateProvenance(stimulus);
  return {
    id: stimulus.id,
    valid: errors.length === 0 && provenance.valid,
    errors: [...errors, ...provenance.errors],
    warnings: [...warnings, ...provenance.warnings],
    format,
    wordCount: wordCountValue,
    questionCount,
    skills: unique(skills),
    register: stimulus.register || 'unclassified',
    informationStructure: stimulus.informationStructure || (['schedule', 'menu', 'invoice', 'receipt', 'form'].includes(format) ? 'nonlinear-or-mixed' : 'linear'),
    provenance: provenance.provenance
  };
}

function analyzeAcademic(passage) {
  const blueprint = TASK_BLUEPRINTS.academic.constraints;
  const errors = [];
  const warnings = [];
  const wordCountValue = countWords(passage.text || '');
  const questionCount = Array.isArray(passage.questions) ? passage.questions.length : 0;
  if (!passage?.id || !passage?.title || !passage?.text) errors.push('Academic passage needs id, title, and text.');
  if (wordCountValue < blueprint.acceptedWordCount[0] || wordCountValue > blueprint.acceptedWordCount[1]) errors.push(`Academic passage must contain ${blueprint.acceptedWordCount[0]}–${blueprint.acceptedWordCount[1]} words; received ${wordCountValue}.`);
  if (questionCount !== blueprint.questionsPerPassage) errors.push(`Academic passage needs exactly ${blueprint.questionsPerPassage} questions; received ${questionCount}.`);
  const skills = [];
  for (const question of passage.questions || []) {
    const result = validateMcqQuestion(question, `${passage.id}/${question.id || 'question'}`);
    errors.push(...result.errors);
    warnings.push(...result.warnings);
    skills.push(normalizeSkill(question.skill));
  }
  const canonicalDomain = canonicalAcademicDomain(passage.domain || passage.title);
  if (canonicalDomain === 'unclassified') warnings.push('Academic domain could not be mapped to the six public blueprint families.');
  const missingCore = ['main-idea', 'factual-information', 'vocabulary-in-context', 'inference'].filter((skill) => !skills.includes(skill));
  if (missingCore.length) warnings.push(`Academic set does not cover all common core skills: ${missingCore.join(', ')}.`);
  const provenance = validateProvenance(passage);
  return {
    id: passage.id,
    valid: errors.length === 0 && provenance.valid,
    errors: [...errors, ...provenance.errors],
    warnings: [...warnings, ...provenance.warnings],
    wordCount: wordCountValue,
    questionCount,
    skills: unique(skills),
    domain: canonicalDomain,
    declaredDomain: passage.domain || '',
    provenance: provenance.provenance
  };
}

function analyzeBuildSet(set) {
  const errors = [];
  const warnings = [];
  const items = set.items || [];
  if (!set.id || !set.title) errors.push('Build set needs id and title.');
  if (items.length !== TASK_BLUEPRINTS.build.constraints.itemsPerSection) errors.push(`Build set needs 10 items; received ${items.length}.`);
  const grammarFamilies = [];
  for (const item of items) {
    const choiceIds = (item.choices || []).map((choice) => choice.id);
    if (!item.id || !item.promptA) errors.push(`${set.id}: each Build item needs id and dialogue context.`);
    if (!Number.isInteger(item.slots) || item.slots < 2 || item.slots > 8) errors.push(`${item.id}: slots must be between 2 and 8.`);
    if (choiceIds.length <= item.slots) warnings.push(`${item.id}: item has no distractor.`);
    if (new Set(choiceIds).size !== choiceIds.length) errors.push(`${item.id}: duplicate choice IDs.`);
    for (const accepted of item.accepted || []) {
      if (accepted.length !== item.slots) errors.push(`${item.id}: accepted sequence length must equal slots.`);
      if (new Set(accepted).size !== accepted.length) errors.push(`${item.id}: accepted sequence reuses a tile.`);
      if (accepted.some((id) => !choiceIds.includes(id))) errors.push(`${item.id}: accepted sequence references an unknown tile.`);
    }
    grammarFamilies.push(...(item.grammar || []).map(normalizeBuildGrammar));
  }
  const provenance = validateProvenance(set);
  return {
    id: set.id,
    valid: errors.length === 0 && provenance.valid,
    errors: [...errors, ...provenance.errors],
    warnings: [...warnings, ...provenance.warnings],
    itemCount: items.length,
    grammarFamilies: unique(grammarFamilies),
    provenance: provenance.provenance
  };
}

function emailPurposes(task) {
  const text = [task.scenario, ...(task.goals || [])].join(' ');
  return unique(PURPOSE_PATTERNS.filter(([, pattern]) => pattern.test(text)).map(([purpose]) => purpose));
}

function analyzeEmail(task) {
  const errors = [];
  const warnings = [];
  const goals = task.goals || [];
  if (!task.id || !task.scenario || !task.recipient || !task.subject) errors.push('Email task needs id, scenario, recipient, and subject.');
  if (goals.length !== 3) errors.push(`Email task needs exactly three communication goals; received ${goals.length}.`);
  if (new Set(goals.map((goal) => normalizeLabel(goal))).size !== goals.length) errors.push('Email communication goals must be distinct.');
  const purposes = emailPurposes(task);
  if (!purposes.length) warnings.push('Email purpose could not be classified from the scenario and goals.');
  const provenance = validateProvenance(task);
  return {
    id: task.id,
    valid: errors.length === 0 && provenance.valid,
    errors: [...errors, ...provenance.errors],
    warnings: [...warnings, ...provenance.warnings],
    goalCount: goals.length,
    purposes,
    setting: task.setting || 'unclassified',
    hasVisualContext: Boolean(task.visual || task.contextAsset),
    provenance: provenance.provenance
  };
}

function analyzeDiscussion(task) {
  const errors = [];
  const warnings = [];
  const students = task.students || [];
  if (!task.id || !task.course || !task.question) errors.push('Discussion task needs id, course, and question.');
  if (students.length !== 2) errors.push(`Discussion task needs exactly two student posts; received ${students.length}.`);
  if (new Set(students.map((student) => normalizeLabel(student.name))).size !== students.length) errors.push('Discussion student identities must be distinct.');
  const postFingerprints = students.map((student) => textFingerprint(student.post || '', 3));
  if (postFingerprints.length === 2 && jaccard(postFingerprints[0], postFingerprints[1]) > 0.72) warnings.push('The two student posts may be too similar.');
  const domain = canonicalAcademicDomain(task.course);
  const provenance = validateProvenance(task);
  return {
    id: task.id,
    valid: errors.length === 0 && provenance.valid,
    errors: [...errors, ...provenance.errors],
    warnings: [...warnings, ...provenance.warnings],
    studentCount: students.length,
    domain,
    course: task.course,
    provenance: provenance.provenance
  };
}

function collectReadingContent(forms = []) {
  const dailyMap = new Map();
  const academicMap = new Map();
  const ctwSetIds = new Set();
  for (const form of forms) {
    for (const moduleName of ['router', 'lower', 'upper']) {
      const module = form[moduleName] || {};
      for (const spec of module.ctw || []) ctwSetIds.add(spec.setId);
      for (const stimulus of module.daily || []) if (!dailyMap.has(stimulus.id)) dailyMap.set(stimulus.id, stimulus);
      if (module.academic?.id && !academicMap.has(module.academic.id)) academicMap.set(module.academic.id, module.academic);
    }
  }
  return { daily: [...dailyMap.values()], academic: [...academicMap.values()], ctwSetIds: [...ctwSetIds] };
}

function duplicatePairs(items, type, threshold = 0.55) {
  const fingerprints = items.map((item) => ({ id: item.id, fingerprint: contentFingerprint(type, item) }));
  const pairs = [];
  for (let left = 0; left < fingerprints.length; left += 1) {
    for (let right = left + 1; right < fingerprints.length; right += 1) {
      const score = jaccard(fingerprints[left].fingerprint, fingerprints[right].fingerprint);
      if (score >= threshold) pairs.push({ type, left: fingerprints[left].id, right: fingerprints[right].id, score: Number(score.toFixed(3)) });
    }
  }
  return pairs.sort((a, b) => b.score - a.score);
}

function idDuplicates(groups) {
  const all = groups.flatMap(([type, items]) => items.map((item) => ({ type, id: item.id })));
  const seen = new Map();
  const duplicates = [];
  for (const item of all) {
    if (seen.has(item.id)) duplicates.push({ id: item.id, firstType: seen.get(item.id), secondType: item.type });
    else seen.set(item.id, item.type);
  }
  return duplicates;
}

function coverageSet(values, targets) {
  const covered = unique(values).filter((value) => targets.includes(value));
  return { covered, missing: targets.filter((value) => !covered.includes(value)), ratio: targets.length ? Number((covered.length / targets.length).toFixed(3)) : 1 };
}

function summarizeAnalyses(items) {
  return {
    count: items.length,
    valid: items.filter((item) => item.valid).length,
    invalid: items.filter((item) => !item.valid).length,
    errors: items.flatMap((item) => item.errors.map((message) => ({ id: item.id, message }))),
    warnings: items.flatMap((item) => item.warnings.map((message) => ({ id: item.id, message })))
  };
}

function buildCoverageReport({
  ctestSets = [],
  readingForms = [],
  buildSets = [],
  emailTasks = [],
  discussionTasks = [],
  focusedDaily = [],
  focusedAcademic = []
} = {}) {
  const reading = collectReadingContent(readingForms);
  const dailyBank = [...reading.daily, ...focusedDaily].filter((item, index, list) => list.findIndex((candidate) => candidate.id === item.id) === index);
  const academicBank = [...reading.academic, ...focusedAcademic].filter((item, index, list) => list.findIndex((candidate) => candidate.id === item.id) === index);
  const ctwAnalyses = ctestSets.map(analyzeCtw);
  const dailyAnalyses = dailyBank.map(analyzeDaily);
  const academicAnalyses = academicBank.map(analyzeAcademic);
  const buildAnalyses = buildSets.map(analyzeBuildSet);
  const emailAnalyses = emailTasks.map(analyzeEmail);
  const discussionAnalyses = discussionTasks.map(analyzeDiscussion);
  const registry = validateSourceRegistry();

  const dailyFormatCoverage = coverageSet(dailyAnalyses.map((item) => item.format), TASK_BLUEPRINTS.daily.constraints.formats);
  const dailySkillCoverage = coverageSet(dailyAnalyses.flatMap((item) => item.skills), TASK_BLUEPRINTS.daily.constraints.skills);
  const academicDomainCoverage = coverageSet(academicAnalyses.map((item) => item.domain), TASK_BLUEPRINTS.academic.constraints.domains);
  const academicSkillCoverage = coverageSet(academicAnalyses.flatMap((item) => item.skills), TASK_BLUEPRINTS.academic.constraints.skills);
  const buildGrammarCoverage = coverageSet(buildAnalyses.flatMap((item) => item.grammarFamilies), TASK_BLUEPRINTS.build.constraints.grammarFamilies);
  const emailPurposeCoverage = coverageSet(emailAnalyses.flatMap((item) => item.purposes), TASK_BLUEPRINTS.email.constraints.purposes);

  const duplicateIds = idDuplicates([
    ['ctw', ctestSets], ['daily', dailyBank], ['academic', academicBank],
    ['build', buildSets], ['email', emailTasks], ['discussion', discussionTasks]
  ]);
  const nearDuplicates = [
    ...duplicatePairs(ctestSets, 'ctw'),
    ...duplicatePairs(dailyBank, 'daily'),
    ...duplicatePairs(academicBank, 'academic'),
    ...duplicatePairs(buildSets, 'build'),
    ...duplicatePairs(emailTasks, 'email'),
    ...duplicatePairs(discussionTasks, 'discussion')
  ];

  const sections = {
    ctw: summarizeAnalyses(ctwAnalyses),
    daily: summarizeAnalyses(dailyAnalyses),
    academic: summarizeAnalyses(academicAnalyses),
    build: summarizeAnalyses(buildAnalyses),
    email: summarizeAnalyses(emailAnalyses),
    discussion: summarizeAnalyses(discussionAnalyses)
  };
  const hardErrors = [
    ...Object.entries(sections).flatMap(([type, section]) => section.errors.map((error) => ({ type, ...error }))),
    ...duplicateIds.map((item) => ({ type: 'id', id: item.id, message: `Duplicate item id across ${item.firstType} and ${item.secondType}.` })),
    ...registry.errors.map((message) => ({ type: 'source-registry', id: 'registry', message }))
  ];
  const coverageRatios = [dailyFormatCoverage.ratio, dailySkillCoverage.ratio, academicDomainCoverage.ratio, academicSkillCoverage.ratio, buildGrammarCoverage.ratio, emailPurposeCoverage.ratio];
  const editorialCoverageScore = Math.round(coverageRatios.reduce((sum, value) => sum + value, 0) / coverageRatios.length * 100);

  return {
    generatedAt: new Date().toISOString(),
    sourceRegistryVersion: OFFICIAL_SOURCE_REGISTRY[0]?.verifiedAt || null,
    sourceRegistry: { valid: registry.valid, count: OFFICIAL_SOURCE_REGISTRY.length, errors: registry.errors },
    formBlueprint: FORM_BLUEPRINT,
    counts: {
      readingForms: readingForms.length,
      ctwPassages: ctestSets.length,
      dailyStimuli: dailyBank.length,
      mockDailyStimuli: reading.daily.length,
      focusedDailyStimuli: focusedDaily.length,
      dailyQuestions: dailyBank.reduce((sum, item) => sum + (item.questions?.length || 0), 0),
      academicPassages: academicBank.length,
      mockAcademicPassages: reading.academic.length,
      focusedAcademicPassages: focusedAcademic.length,
      academicQuestions: academicBank.reduce((sum, item) => sum + (item.questions?.length || 0), 0),
      buildSets: buildSets.length,
      buildItems: buildSets.reduce((sum, item) => sum + (item.items?.length || 0), 0),
      emailTasks: emailTasks.length,
      discussionTasks: discussionTasks.length
    },
    sections,
    analyses: {
      ctw: ctwAnalyses,
      daily: dailyAnalyses,
      academic: academicAnalyses,
      build: buildAnalyses,
      email: emailAnalyses,
      discussion: discussionAnalyses
    },
    coverage: {
      dailyFormats: dailyFormatCoverage,
      dailySkills: dailySkillCoverage,
      academicDomains: academicDomainCoverage,
      academicSkills: academicSkillCoverage,
      buildGrammar: buildGrammarCoverage,
      emailPurposes: emailPurposeCoverage
    },
    duplicates: { duplicateIds, nearDuplicates },
    hardErrors,
    warnings: Object.entries(sections).flatMap(([type, section]) => section.warnings.map((warning) => ({ type, ...warning }))),
    editorialCoverageScore,
    psychometricCalibration: {
      status: 'not-calibrated',
      note: 'Coverage and structural validation do not establish item difficulty, discrimination, routing validity, equating, or official score equivalence.'
    },
    sourcePolicy: SOURCE_POLICY,
    releaseGate: {
      structuralPass: hardErrors.length === 0,
      nearDuplicateReviewRequired: nearDuplicates.length > 0,
      humanReviewRequired: true,
      pilotRequired: true
    }
  };
}

function validateCandidate(taskType, item) {
  if (taskType === 'ctw') return analyzeCtw(item);
  if (taskType === 'daily') return analyzeDaily(item);
  if (taskType === 'academic') return analyzeAcademic(item);
  if (taskType === 'build') return analyzeBuildSet(item);
  if (taskType === 'email') return analyzeEmail(item);
  if (taskType === 'discussion') return analyzeDiscussion(item);
  return { id: item?.id || null, valid: false, errors: [`Unknown task type: ${taskType}.`], warnings: [] };
}


/* src/reading.js */
function readingCtestOptionsForSet(set, idPrefix) {
  return {
    targetLexicalPositions: set?.targetLexicalPositions || null,
    targetPolicy: set?.targetPolicy || (set?.targetLexicalPositions ? 'curated' : 'canonical-every-second-word'),
    idPrefix
  };
}

function resolveSet(ctestSets, setId) {
  const set = ctestSets.find((item) => item.id === setId);
  if (!set) throw new Error(`Reading form references unknown CTW set: ${setId}`);
  return set;
}

function cloneStimulus(stimulus) {
  return {
    id: stimulus.id,
    type: stimulus.type,
    title: stimulus.title,
    label: stimulus.label || '',
    text: stimulus.text,
    domain: stimulus.domain || '',
    scored: stimulus.scored !== false
  };
}

function buildReadingModule(form, ctestSets, moduleName = 'router') {
  if (!form || !['router', 'lower', 'upper'].includes(moduleName)) throw new Error('Unknown Reading module.');
  const module = form[moduleName];
  if (!module) throw new Error(`Missing Reading module: ${moduleName}`);
  const pages = [];
  let itemNumber = 1;

  for (const [index, spec] of (module.ctw || []).entries()) {
    const set = resolveSet(ctestSets, spec.setId);
    const pageId = `${form.id}-${moduleName}-ctw-${index + 1}`;
    const ctest = createCtest(set.sourceText, readingCtestOptionsForSet(set, pageId));
    pages.push({
      id: pageId,
      type: 'ctw',
      taskLabel: 'Complete the Words',
      set,
      ctest,
      scored: spec.scored !== false,
      research: spec.scored === false,
      difficulty: Array.isArray(spec.difficulty) ? spec.difficulty : Array(10).fill(0),
      itemStart: itemNumber,
      itemEnd: itemNumber + ctest.gaps.length - 1,
      itemCount: ctest.gaps.length
    });
    itemNumber += ctest.gaps.length;
  }

  for (const stimulus of (module.daily || [])) {
    for (const question of stimulus.questions || []) {
      pages.push({
        id: question.id,
        type: 'daily',
        taskLabel: 'Read in Daily Life',
        stimulus: cloneStimulus(stimulus),
        question: structuredClone(question),
        scored: stimulus.scored !== false,
        research: stimulus.scored === false,
        difficulty: Number(question.difficulty) || 0,
        itemStart: itemNumber,
        itemEnd: itemNumber,
        itemCount: 1
      });
      itemNumber += 1;
    }
  }

  if (module.academic) {
    const passage = module.academic;
    for (const question of passage.questions || []) {
      pages.push({
        id: question.id,
        type: 'academic',
        taskLabel: 'Read an Academic Passage',
        stimulus: cloneStimulus({ ...passage, type: 'academic' }),
        question: structuredClone(question),
        scored: passage.scored !== false,
        research: passage.scored === false,
        difficulty: Number(question.difficulty) || 0,
        itemStart: itemNumber,
        itemEnd: itemNumber,
        itemCount: 1
      });
      itemNumber += 1;
    }
  }

  return {
    name: moduleName,
    seconds: Number(module.seconds) || 0,
    pages,
    totalItems: itemNumber - 1,
    scoredItems: pages.reduce((sum, page) => sum + (page.scored ? page.itemCount : 0), 0),
    researchItems: pages.reduce((sum, page) => sum + (page.research ? page.itemCount : 0), 0)
  };
}

function pageAnswerCount(page, answers = {}) {
  if (page.type === 'ctw') return page.ctest.gaps.filter((gap) => String(answers[gap.id] || '').trim()).length;
  return String(answers[page.question.id] || '').trim() ? 1 : 0;
}

function moduleAnsweredCount(module, answers = {}) {
  return module.pages.reduce((sum, page) => sum + pageAnswerCount(page, answers), 0);
}

function moduleUnansweredCount(module, answers = {}) {
  return Math.max(0, module.totalItems - moduleAnsweredCount(module, answers));
}

function gradeReadingModule(module, answers = {}) {
  const details = [];
  for (const page of module.pages) {
    if (page.type === 'ctw') {
      const result = gradeCtest(page.ctest, answers);
      result.details.forEach((detail, index) => {
        details.push({
          id: detail.id,
          pageId: page.id,
          type: 'ctw',
          taskLabel: page.taskLabel,
          moduleName: module.name,
          itemNumber: page.itemStart + index,
          response: detail.response,
          answer: detail.answer,
          word: detail.word,
          visible: detail.visible,
          correct: detail.correct,
          scored: page.scored,
          research: page.research,
          difficulty: Number(page.difficulty[index]) || 0,
          explanation: `The complete word is “${detail.word}.”`
        });
      });
    } else {
      const response = String(answers[page.question.id] || '');
      details.push({
        id: page.question.id,
        pageId: page.id,
        type: page.type,
        taskLabel: page.taskLabel,
        moduleName: module.name,
        itemNumber: page.itemStart,
        response,
        answer: page.question.answer,
        correct: response === page.question.answer,
        scored: page.scored,
        research: page.research,
        difficulty: Number(page.difficulty) || 0,
        skill: page.question.skill,
        stem: page.question.stem,
        explanation: page.question.explanation || ''
      });
    }
  }
  const scored = details.filter((item) => item.scored);
  return {
    score: scored.filter((item) => item.correct).length,
    maxScore: scored.length,
    allPracticeScore: details.filter((item) => item.correct).length,
    allPracticeMaxScore: details.length,
    unanswered: details.filter((item) => !String(item.response || '').trim()).length,
    details
  };
}

function logNormalPrior(theta) {
  return -0.5 * theta * theta;
}

function logBernoulli(theta, difficulty, correct) {
  const z = Math.max(-20, Math.min(20, theta - difficulty));
  const p = 1 / (1 + Math.exp(-z));
  return correct ? Math.log(Math.max(1e-12, p)) : Math.log(Math.max(1e-12, 1 - p));
}

/**
 * Transparent practice routing estimate. This is deliberately not presented as
 * ETS operational routing: the items have not been psychometrically calibrated.
 */
function estimateRouterAbility(details = []) {
  const scored = details.filter((item) => item.scored);
  const grid = Array.from({ length: 121 }, (_, index) => -3 + index * 0.05);
  const logs = grid.map((theta) => logNormalPrior(theta) + scored.reduce(
    (sum, item) => sum + logBernoulli(theta, Number(item.difficulty) || 0, item.correct), 0
  ));
  const maxLog = Math.max(...logs);
  const weights = logs.map((value) => Math.exp(value - maxLog));
  const total = weights.reduce((sum, value) => sum + value, 0) || 1;
  const theta = weights.reduce((sum, value, index) => sum + value * grid[index], 0) / total;
  const variance = weights.reduce((sum, value, index) => sum + value * (grid[index] - theta) ** 2, 0) / total;
  const rawScore = scored.filter((item) => item.correct).length;
  return {
    theta: Number(theta.toFixed(3)),
    standardError: Number(Math.sqrt(Math.max(0, variance)).toFixed(3)),
    rawScore,
    maxScore: scored.length,
    route: theta >= 0 ? 'upper' : 'lower',
    method: 'practice-eap-1pl',
    calibrated: false
  };
}

function gradeReadingAttempt(form, ctestSets, answers = {}, route = null) {
  const routerModule = buildReadingModule(form, ctestSets, 'router');
  const routerResult = gradeReadingModule(routerModule, answers);
  const routing = estimateRouterAbility(routerResult.details);
  const chosenRoute = route === 'lower' || route === 'upper' ? route : routing.route;
  const module2 = buildReadingModule(form, ctestSets, chosenRoute);
  const module2Result = gradeReadingModule(module2, answers);
  const scoredDetails = [...routerResult.details, ...module2Result.details].filter((item) => item.scored);
  const allDetails = [...routerResult.details, ...module2Result.details];
  const byType = Object.fromEntries(['ctw', 'daily', 'academic'].map((type) => {
    const subset = scoredDetails.filter((item) => item.type === type);
    return [type, {
      score: subset.filter((item) => item.correct).length,
      maxScore: subset.length
    }];
  }));
  return {
    score: scoredDetails.filter((item) => item.correct).length,
    maxScore: scoredDetails.length,
    allPracticeScore: allDetails.filter((item) => item.correct).length,
    allPracticeMaxScore: allDetails.length,
    routerScore: routerResult.score,
    routerMaxScore: routerResult.maxScore,
    module2Score: module2Result.score,
    module2MaxScore: module2Result.maxScore,
    researchScore: allDetails.filter((item) => item.research && item.correct).length,
    researchMaxScore: allDetails.filter((item) => item.research).length,
    route: chosenRoute,
    routing,
    byType,
    details: allDetails
  };
}

function validateQuestion(question, errors, context) {
  if (!question?.id || !question?.stem || !Array.isArray(question.options) || question.options.length !== 4) errors.push(`${context}: invalid question structure.`);
  const optionIds = new Set((question?.options || []).map((option) => option.id));
  if (!optionIds.has(question?.answer)) errors.push(`${context}: answer is not one of the option IDs.`);
  if (optionIds.size !== (question?.options || []).length) errors.push(`${context}: duplicate option IDs.`);
}

function validateReadingForm(form, ctestSets) {
  const errors = [];
  const warnings = [];
  if (!form?.id || !form?.title) errors.push('Reading form needs an id and title.');
  for (const moduleName of ['router', 'lower', 'upper']) {
    let module;
    try { module = buildReadingModule(form, ctestSets, moduleName); }
    catch (error) { errors.push(error.message); continue; }
    const expectedItems = moduleName === 'router' ? 35 : 15;
    const expectedScored = moduleName === 'router' ? 20 : 15;
    if (module.totalItems !== expectedItems) errors.push(`${moduleName} must present ${expectedItems} items; received ${module.totalItems}.`);
    if (module.scoredItems !== expectedScored) errors.push(`${moduleName} must contain ${expectedScored} scored items; received ${module.scoredItems}.`);
    if (moduleName === 'router' && module.researchItems !== 15) errors.push(`router must contain 15 research items; received ${module.researchItems}.`);
  }

  const stimuli = [
    ...(form.router?.daily || []), ...(form.lower?.daily || []),
    ...(form.upper?.daily || [])
  ];
  for (const stimulus of stimuli) {
    const words = countWords(stimulus.text);
    if (words < 15 || words > 150) errors.push(`${stimulus.id}: Daily Life text should contain 15–150 words; received ${words}.`);
    if (![2, 3].includes(stimulus.questions?.length)) errors.push(`${stimulus.id}: Daily Life text needs 2 or 3 questions.`);
    (stimulus.questions || []).forEach((question) => validateQuestion(question, errors, `${stimulus.id}/${question.id}`));
  }

  for (const passage of [form.router?.academic, form.lower?.academic, form.upper?.academic].filter(Boolean)) {
    const words = countWords(passage.text);
    if (words < 170 || words > 260) warnings.push(`${passage.id}: Academic passage is ${words} words; public guidance describes approximately 200 words.`);
    if (passage.questions?.length !== 5) errors.push(`${passage.id}: Academic passage needs 5 questions.`);
    (passage.questions || []).forEach((question) => validateQuestion(question, errors, `${passage.id}/${question.id}`));
  }
  return { valid: errors.length === 0, errors, warnings };
}


/* src/storage.js */
const STORAGE_KEY = 'toefl-2026-practice-lab:v6';
const LEGACY_KEYS = ['toefl-2026-practice-lab:v4', 'toefl-2026-practice-lab:v3', 'toefl-2026-practice-lab:v2'];
const SCHEMA_VERSION = 6;
const APP_VERSION = '6.0.0';
const MAX_ATTEMPTS = 200;
const WRITE_DEBOUNCE_MS = 180;

function defaultState() {
  return {
    schemaVersion: SCHEMA_VERSION,
    attempts: [],
    currentAttempt: null,
    notebook: [],
    preferences: {
      practiceMode: 'exam', ctwBand: 'mixed', readingFormId: 'reading-form-01', buildSetId: 'build-core-01', provider: 'local', model: '',
      generatorModel: '', verifierModel: '', graderModel: '', adjudicatorModel: '', apiBase: '', gradeRoute: '/api/grade', generateRoute: '/api/generate',
      theme: 'light', showTimer: true, autoSaveMistakes: true
    }
  };
}

function isObject(value) {
  return Boolean(value) && typeof value === 'object' && !Array.isArray(value);
}

function safeParse(raw) {
  try { return JSON.parse(raw); } catch { return null; }
}

function nonNegativeNumber(value, fallback = 0) {
  const number = Number(value);
  return Number.isFinite(number) && number >= 0 ? number : fallback;
}

function normalizeNotebookItem(item) {
  if (!isObject(item) || !String(item.word || '').trim()) return null;
  const now = item.savedAt || new Date().toISOString();
  return {
    reviewCount: 0,
    intervalDays: 0,
    ease: 2.5,
    nextReviewAt: now,
    lastReviewedAt: null,
    ...item,
    word: String(item.word).trim()
  };
}

function normalizeStageTimings(value) {
  const source = isObject(value) ? value : {};
  return Object.fromEntries(
    ['ctw', 'router', 'module2', 'build', 'email', 'discussion'].map((key) => [key, nonNegativeNumber(source[key], 0)])
  );
}

function normalizeAttempt(item, { current = false } = {}) {
  if (!isObject(item)) return null;
  const taskType = ['ctw', 'writing', 'reading'].includes(item.taskType) ? item.taskType : null;
  if (!taskType) return null;
  const validWritingStages = new Set(['writing-intro', 'build', 'email-intro', 'email', 'discussion-intro', 'discussion']);
  const validReadingStages = new Set(['reading-intro', 'router', 'reading-transition', 'module2']);
  const stage = taskType === 'ctw'
    ? 'ctw'
    : taskType === 'reading'
      ? (validReadingStages.has(item.stage) ? item.stage : 'reading-intro')
      : (validWritingStages.has(item.stage) ? item.stage : 'writing-intro');
  const remaining = item.remainingSec == null ? null : nonNegativeNumber(item.remainingSec, null);
  return {
    ...item,
    id: String(item.id || makeId()),
    taskType,
    stage,
    status: current ? 'in_progress' : item.status === 'completed' ? 'completed' : 'in_progress',
    answers: isObject(item.answers) ? item.answers : {},
    elapsedSec: nonNegativeNumber(item.elapsedSec, 0),
    remainingSec: remaining,
    stageTimings: normalizeStageTimings(item.stageTimings),
    attemptSchemaVersion: item.attemptSchemaVersion || SCHEMA_VERSION,
    appVersion: item.appVersion || '2.x'
  };
}

function migrate(input) {
  const base = defaultState();
  if (!isObject(input)) return base;
  const attempts = Array.isArray(input.attempts)
    ? input.attempts.map((item) => normalizeAttempt(item)).filter(Boolean).slice(0, MAX_ATTEMPTS)
    : [];
  const notebook = Array.isArray(input.notebook)
    ? input.notebook.map(normalizeNotebookItem).filter(Boolean)
    : [];
  return {
    ...base,
    ...input,
    schemaVersion: SCHEMA_VERSION,
    attempts,
    notebook,
    preferences: { ...base.preferences, ...(isObject(input.preferences) ? input.preferences : {}) },
    currentAttempt: normalizeAttempt(input.currentAttempt, { current: true })
  };
}

let memoryFallback = defaultState();
let stateCache = null;
let cacheRaw = null;
let persistedRaw = null;
let pendingWriteTimer = null;
let lastStorageError = null;

function markStorageHealthy() {
  lastStorageError = null;
}

function markStorageUnavailable(error) {
  lastStorageError = error instanceof Error ? error.message : String(error || 'Browser storage is unavailable.');
}

function readStoredSnapshot() {
  try {
    const direct = localStorage.getItem(STORAGE_KEY);
    if (direct != null) {
      markStorageHealthy();
      return { available: true, key: STORAGE_KEY, raw: direct };
    }
    for (const key of LEGACY_KEYS) {
      const raw = localStorage.getItem(key);
      if (raw != null) {
        markStorageHealthy();
        return { available: true, key, raw };
      }
    }
    markStorageHealthy();
    return { available: true, key: null, raw: null };
  } catch (error) {
    markStorageUnavailable(error);
    return { available: false, key: null, raw: null };
  }
}

function cancelPendingWrite() {
  if (pendingWriteTimer != null) {
    clearTimeout(pendingWriteTimer);
    pendingWriteTimer = null;
  }
}

function writeRawNow(raw = cacheRaw) {
  cancelPendingWrite();
  if (raw == null) return false;
  try {
    localStorage.setItem(STORAGE_KEY, raw);
    persistedRaw = raw;
    markStorageHealthy();
    return true;
  } catch (error) {
    markStorageUnavailable(error);
    return false;
  }
}

function scheduleWrite() {
  cancelPendingWrite();
  pendingWriteTimer = setTimeout(() => writeRawNow(), WRITE_DEBOUNCE_MS);
}

function flushState() {
  if (cacheRaw == null) return false;
  if (cacheRaw === persistedRaw && pendingWriteTimer == null) return true;
  return writeRawNow(cacheRaw);
}

function loadState() {
  const snapshot = readStoredSnapshot();
  if (!snapshot.available) {
    if (stateCache) return stateCache;
    stateCache = migrate(memoryFallback);
    cacheRaw = JSON.stringify(stateCache);
    return stateCache;
  }

  // The browser copy has not changed since our last successful write. Keep the
  // newer in-memory state while a debounced autosave is pending.
  if (stateCache && snapshot.key === STORAGE_KEY && snapshot.raw === persistedRaw) return stateCache;
  if (stateCache && snapshot.key === STORAGE_KEY && snapshot.raw === cacheRaw) {
    persistedRaw = snapshot.raw;
    cancelPendingWrite();
    return stateCache;
  }

  // A missing/different value means another tab, a test reset, or a manual
  // storage clear changed the source of truth. Do not overwrite it with stale cache.
  cancelPendingWrite();
  const parsed = snapshot.raw == null ? null : safeParse(snapshot.raw);
  const state = migrate(parsed);
  stateCache = state;
  memoryFallback = state;
  cacheRaw = JSON.stringify(state);
  persistedRaw = snapshot.key === STORAGE_KEY ? snapshot.raw : null;

  // Migrate a legacy key or recover malformed/unnormalized state once, rather
  // than rewriting localStorage on every read.
  if (snapshot.key !== STORAGE_KEY || snapshot.raw !== cacheRaw) writeRawNow(cacheRaw);
  return stateCache;
}

function saveState(state, { defer = false } = {}) {
  const normalized = migrate(state);
  stateCache = normalized;
  memoryFallback = normalized;
  cacheRaw = JSON.stringify(normalized);
  if (defer) scheduleWrite();
  else writeRawNow(cacheRaw);
  return normalized;
}

function getStorageStatus() {
  return {
    persistent: !lastStorageError,
    pending: pendingWriteTimer != null,
    maxAttempts: MAX_ATTEMPTS,
    message: lastStorageError || `Saved in this browser. Up to ${MAX_ATTEMPTS} recent attempts are retained.`
  };
}

function updateState(updater, { defer = false } = {}) {
  const state = loadState();
  const next = typeof updater === 'function' ? updater(structuredClone(state)) : { ...state, ...updater };
  return saveState(next, { defer });
}

function makeId(prefix = 'attempt') {
  if (globalThis.crypto?.randomUUID) return `${prefix}-${crypto.randomUUID()}`;
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
}

function beginAttempt(partial) {
  const now = new Date().toISOString();
  const attempt = {
    id: makeId(),
    status: 'in_progress',
    startedAt: now,
    updatedAt: now,
    elapsedSec: 0,
    remainingSec: null,
    stageTimings: normalizeStageTimings(partial?.stageTimings),
    answers: {},
    attemptSchemaVersion: SCHEMA_VERSION,
    appVersion: APP_VERSION,
    ...partial
  };
  updateState((state) => {
    state.currentAttempt = normalizeAttempt(attempt, { current: true });
    return state;
  });
  return loadState().currentAttempt;
}

function patchCurrentAttempt(patch) {
  let currentAttempt = null;
  updateState((state) => {
    if (!state.currentAttempt) return state;
    const resolved = typeof patch === 'function'
      ? patch(structuredClone(state.currentAttempt))
      : { ...state.currentAttempt, ...patch };
    currentAttempt = normalizeAttempt({ ...resolved, updatedAt: new Date().toISOString() }, { current: true });
    state.currentAttempt = currentAttempt;
    return state;
  }, { defer: true });
  return currentAttempt;
}

function finishCurrentAttempt(resultPatch = {}) {
  let completed = null;
  updateState((state) => {
    if (!state.currentAttempt) return state;
    const now = new Date().toISOString();
    completed = normalizeAttempt({
      ...state.currentAttempt,
      ...resultPatch,
      status: 'completed',
      updatedAt: now,
      completedAt: now
    });
    state.attempts = [completed, ...state.attempts.filter((item) => item.id !== completed.id)].slice(0, MAX_ATTEMPTS);
    state.currentAttempt = null;
    return state;
  });
  return completed;
}

function discardCurrentAttempt() {
  updateState((state) => {
    state.currentAttempt = null;
    return state;
  });
}

function updatePreferences(patch) {
  return updateState((state) => {
    state.preferences = { ...state.preferences, ...patch };
    return state;
  }, { defer: true }).preferences;
}

function addNotebookEntry(entry) {
  let saved = null;
  updateState((state) => {
    const key = String(entry.word || '').toLowerCase();
    const existing = state.notebook.find((item) => String(item.word).toLowerCase() === key);
    if (existing) {
      saved = normalizeNotebookItem({ ...existing, ...entry, savedAt: existing.savedAt });
      state.notebook = state.notebook.map((item) => item === existing ? saved : item);
    } else {
      const now = new Date().toISOString();
      saved = normalizeNotebookItem({ id: makeId('word'), savedAt: now, nextReviewAt: now, ...entry });
      if (saved) state.notebook = [saved, ...state.notebook];
    }
    return state;
  }, { defer: true });
  return saved;
}

function removeNotebookEntry(id) {
  updateState((state) => {
    state.notebook = state.notebook.filter((item) => item.id !== id);
    return state;
  }, { defer: true });
}

function reviewNotebookEntry(id, rating = 'good') {
  let reviewed = null;
  updateState((state) => {
    state.notebook = state.notebook.map((item) => {
      if (item.id !== id) return item;
      const previous = Math.max(0, Number(item.intervalDays) || 0);
      let interval;
      if (rating === 'again') interval = 1;
      else if (previous < 1) interval = rating === 'hard' ? 1 : 2;
      else interval = Math.max(1, Math.round(previous * (rating === 'hard' ? 1.4 : 2.3)));
      const ease = Math.max(1.3, Math.min(3, Number(item.ease || 2.5) + (rating === 'again' ? -0.2 : rating === 'hard' ? -0.05 : 0.05)));
      const now = new Date();
      const next = new Date(now.getTime() + interval * 86400000).toISOString();
      reviewed = {
        ...item,
        reviewCount: (item.reviewCount || 0) + 1,
        intervalDays: interval,
        ease,
        nextReviewAt: next,
        lastReviewedAt: now.toISOString(),
        lastRating: rating
      };
      return reviewed;
    });
    return state;
  }, { defer: true });
  return reviewed;
}

function dueNotebookEntries(state = loadState(), now = Date.now()) {
  return state.notebook
    .filter((item) => !item.nextReviewAt || new Date(item.nextReviewAt).getTime() <= now)
    .sort((a, b) => String(a.nextReviewAt || '').localeCompare(String(b.nextReviewAt || '')));
}

function clearAttempts() {
  updateState((state) => {
    state.attempts = [];
    state.currentAttempt = null;
    return state;
  });
}

function importState(payload) {
  const incoming = migrate(payload);
  const current = loadState();
  const attempts = [...incoming.attempts, ...current.attempts]
    .filter((item, index, list) => list.findIndex((candidate) => candidate.id === item.id) === index)
    .sort((a, b) => String(b.completedAt || b.updatedAt).localeCompare(String(a.completedAt || a.updatedAt)))
    .slice(0, MAX_ATTEMPTS);
  const notebook = [...incoming.notebook, ...current.notebook]
    .filter((item, index, list) => list.findIndex((candidate) => String(candidate.word).toLowerCase() === String(item.word).toLowerCase()) === index);
  return saveState({
    ...current,
    attempts,
    notebook,
    currentAttempt: current.currentAttempt || incoming.currentAttempt || null,
    preferences: { ...current.preferences, ...incoming.preferences }
  });
}

function exportState() {
  return { exportedAt: new Date().toISOString(), app: 'TOEFL 2026 Practice Lab', ...loadState() };
}

function csvValue(value) {
  const raw = String(value ?? '');
  const safe = /^[=+@]/.test(raw) || /^-[^0-9.]/.test(raw) ? `'${raw}` : raw;
  return `"${safe.replaceAll('"', '""')}"`;
}

function attemptsToCsv(attempts = loadState().attempts) {
  const rows = [[
    'id', 'task', 'set', 'started_at', 'completed_at', 'duration_seconds',
    'ctw_seconds', 'reading_router_seconds', 'reading_module2_seconds', 'build_seconds', 'email_seconds', 'discussion_seconds',
    'score', 'max_score', 'reading_route', 'reading_theta', 'email_score', 'discussion_score', 'grading_source',
    'error_tags', 'writing_dimensions', 'app_version'
  ]];
  for (const item of attempts) {
    const errors = item.result?.details?.filter?.((entry) => !entry.correct).map((entry) => entry.word || entry.skill || entry.itemId || entry.id).join('|') || '';
    const dimensions = JSON.stringify({
      email: item.result?.email?.dimensions || null,
      discussion: item.result?.discussion?.dimensions || null
    });
    const timings = normalizeStageTimings(item.stageTimings);
    rows.push([
      item.id, item.taskType, item.setId || '', item.startedAt || '', item.completedAt || '', item.elapsedSec ?? '',
      timings.ctw, timings.router, timings.module2, timings.build, timings.email, timings.discussion,
      item.result?.score ?? item.result?.buildScore ?? '', item.result?.maxScore ?? item.result?.buildMaxScore ?? '',
      item.result?.route ?? item.route ?? '', item.result?.routing?.theta ?? item.routing?.theta ?? '',
      item.result?.email?.score ?? '', item.result?.discussion?.score ?? '', item.result?.gradingSource ?? '',
      errors, dimensions, item.appVersion || ''
    ]);
  }
  return rows.map((row) => row.map(csvValue).join(',')).join('\n');
}

if (typeof globalThis.addEventListener === 'function') {
  globalThis.addEventListener('storage', (event) => {
    if (event.key === STORAGE_KEY || LEGACY_KEYS.includes(event.key) || event.key == null) {
      cancelPendingWrite();
      stateCache = null;
      cacheRaw = null;
      persistedRaw = null;
    }
  });
}

function wordCount(text){return(String(text).trim().match(/\b[\p{L}\p{N}]+(?:[’'-][\p{L}\p{N}]+)*\b/gu)||[]).length;}
function sentenceCount(text){return(String(text).match(/[.!?]+(?:\s|$)/g)||[]).length;}
function lexicalDiversity(text){const t=(String(text).toLowerCase().match(/\b[a-z]+(?:['’-][a-z]+)*\b/g)||[]).filter(x=>x.length>2);return t.length?new Set(t).size/t.length:0;}
function gradeBuild(items,answers={}){const details=items.map((item)=>{const response=Array.isArray(answers[item.id])?answers[item.id].filter(Boolean):[];const correct=item.accepted.some((a)=>a.length===response.length&&a.every((id,i)=>id===response[i]));return{itemId:item.id,response,correct,accepted:item.accepted,explanation:item.explanation,grammar:item.grammar};});return{score:details.filter(x=>x.correct).length,maxScore:details.length,unanswered:details.filter(x=>x.response.length===0).length,details};}
function commonDiagnostics(text){const words=wordCount(text),sentences=sentenceCount(text),diversity=lexicalDiversity(text);return{words,sentences,diversity,longRuns:(String(text).match(/\b\w+(?:\s+\w+){28,}\b/g)||[]).length,repeated:/(\b\w+\b)(?:\s+\1){2,}/i.test(text)};}
function countMatchedGroups(text,groups=[]){const n=String(text).toLowerCase();return groups.filter((alts)=>alts.some((p)=>n.includes(String(p).toLowerCase()))).length;}
function hasSocialConventions(text){const n=String(text).toLowerCase();const greeting=/(^|\n)\s*(dear|hello|hi)\b/.test(n),polite=/\b(could|would|please|thank|appreciate|possible|wondering)\b/.test(n),closing=/\b(sincerely|best|regards|thank you|thanks)\b/.test(n);return{greeting,polite,closing,count:[greeting,polite,closing].filter(Boolean).length};}
function ngrams(text,n=6){const tokens=(String(text).toLowerCase().match(/\b[a-z]+(?:['’-][a-z]+)*\b/g)||[]);const out=[];for(let i=0;i<=tokens.length-n;i++)out.push(tokens.slice(i,i+n).join(' '));return out;}

/**
 * Render an in-app confirmation dialog instead of relying on a native browser
 * confirmation. Some embedded/sandboxed preview surfaces suppress native
 * dialogs, which made Submit and Exit appear unresponsive.
 */
function pauseActiveTimerForDialog() {
  if (!ui.exam || !ui.timerMode) return null;
  const paused = {
    mode: ui.timerMode,
    value: timerSeconds(),
    callback: ui.timerCallback,
    stage: currentData().currentAttempt?.stage || null
  };
  persistCurrentTimer(paused.value);
  stopTimer();
  updateTimerDom(paused.value);
  return paused;
}

function resumePausedTimer(paused) {
  if (!paused || !ui.exam || ui.grading) return;
  if (paused.mode === 'elapsed') startElapsedTimer(paused.value);
  else startCountdown(paused.value, paused.callback || stageTimeoutCallback(paused.stage));
  updateTimerDom(paused.value);
}

function askConfirmation({
  title = 'Please confirm',
  message = '',
  confirmLabel = 'Continue',
  cancelLabel = 'Cancel',
  destructive = false
} = {}) {
  if (activeConfirmationCleanup) activeConfirmationCleanup(false);
  const pausedTimer = pauseActiveTimerForDialog();

  return new Promise((resolve) => {
    const previousFocus = document.activeElement;
    const layer = document.createElement('div');
    const suffix = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    const titleId = `confirm-title-${suffix}`;
    const descriptionId = `confirm-description-${suffix}`;
    layer.id = 'confirm-dialog-layer';
    layer.className = 'modal-backdrop confirm-backdrop';
    layer.innerHTML = `
      <section class="confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="${titleId}" aria-describedby="${descriptionId}">
        <div class="confirm-icon" aria-hidden="true">${destructive ? '!' : '?'}</div>
        <div class="confirm-copy">
          <h2 id="${titleId}">${esc(title)}</h2>
          <p id="${descriptionId}">${esc(message)}</p>
        </div>
        <div class="confirm-actions">
          <button type="button" class="button ghost" data-confirm-action="cancel">${esc(cancelLabel)}</button>
          <button type="button" class="button ${destructive ? 'danger-solid' : 'primary'}" data-confirm-action="confirm">${esc(confirmLabel)}</button>
        </div>
      </section>`;

    let settled = false;
    function finish(value) {
      if (settled) return;
      settled = true;
      document.removeEventListener('keydown', keyHandler, true);
      layer.remove();
      document.body.classList.remove('confirm-open');
      activeConfirmationCleanup = null;
      if (!value) resumePausedTimer(pausedTimer);
      if (previousFocus && typeof previousFocus.focus === 'function' && previousFocus.isConnected) {
        previousFocus.focus({ preventScroll: true });
      }
      resolve(value);
    }

    function keyHandler(event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        finish(false);
        return;
      }
      if (event.key !== 'Tab') return;
      const focusable = [...layer.querySelectorAll('button:not([disabled])')];
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    layer.addEventListener('click', (event) => {
      const button = event.target.closest('[data-confirm-action]');
      if (button?.dataset.confirmAction === 'confirm') finish(true);
      else if (button?.dataset.confirmAction === 'cancel' || event.target === layer) finish(false);
    });
    document.addEventListener('keydown', keyHandler, true);
    document.body.appendChild(layer);
    document.body.classList.add('confirm-open');
    activeConfirmationCleanup = finish;
    requestAnimationFrame(() => layer.querySelector('[data-confirm-action="cancel"]')?.focus());
  });
}

function icon(name) {
  return `<span class="icon">${ICONS[name] || ''}</span>`;
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (character) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
}

function attr(value) {
  return esc(value).replace(/`/g, '&#96;');
}

function formatDate(value, withTime = true) {
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '—';
  return new Intl.DateTimeFormat('zh-TW', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    ...(withTime ? { hour: '2-digit', minute: '2-digit' } : {})
  }).format(date);
}

function formatDuration(seconds) {
  const total = Math.max(0, Math.round(Number(seconds) || 0));
  const minutes = Math.floor(total / 60);
  const rest = total % 60;
  return `${minutes}:${String(rest).padStart(2, '0')}`;
}

function downloadFile(filename, content, type = 'application/json') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

function computeStats(attempts) {
  const completed = attempts.filter((item) => item.status === 'completed');
  const reading = completed.filter((item) => item.taskType === 'reading');
  const ctw = completed.filter((item) => item.taskType === 'ctw');
  const writing = completed.filter((item) => item.taskType === 'writing');
  const readingPoints = reading.reduce((sum, item) => sum + (item.result?.score || 0), 0);
  const readingMax = reading.reduce((sum, item) => sum + (item.result?.maxScore || 0), 0);
  const ctwDetails = [
    ...ctw.flatMap((item) => item.result?.details || []),
    ...reading.flatMap((item) => (item.result?.details || []).filter((detail) => detail.type === 'ctw' && detail.scored))
  ];
  const buildPoints = writing.reduce((sum, item) => sum + (item.result?.buildScore || 0), 0);
  const buildMax = writing.reduce((sum, item) => sum + (item.result?.buildMaxScore || 0), 0);
  const writingScores = writing.flatMap((item) => [item.result?.email?.score, item.result?.discussion?.score]).filter(Number.isFinite);
  return {
    total: completed.length,
    readingAccuracy: readingMax ? Math.round(readingPoints / readingMax * 100) : null,
    ctwAccuracy: ctwDetails.length ? Math.round(ctwDetails.filter((item) => item.correct).length / ctwDetails.length * 100) : null,
    buildAccuracy: buildMax ? Math.round(buildPoints / buildMax * 100) : null,
    writingAverage: writingScores.length ? (writingScores.reduce((a, b) => a + b, 0) / writingScores.length).toFixed(1) : null
  };
}

function ctestOptionsForSet(set) {
  return {
    targetLexicalPositions: set?.targetLexicalPositions || null,
    targetPolicy: set?.targetPolicy || (set?.targetLexicalPositions ? 'curated' : 'canonical-every-second-word')
  };
}

function weakSkills(attempts) {
  const map = new Map();
  attempts.forEach((attempt) => {
    if (attempt.taskType === 'ctw') {
      (attempt.result?.details || []).filter((d) => !d.correct).forEach((d) => {
        const key = `CTW · ${d.word}`; map.set(key, (map.get(key) || 0) + 1);
      });
    } else if (attempt.taskType === 'reading') {
      (attempt.result?.details || []).filter((d) => d.scored && !d.correct).forEach((d) => {
        const label = d.type === 'ctw' ? `CTW · ${d.word}` : `${d.type === 'daily' ? 'Daily Life' : 'Academic'} · ${d.skill || 'reading comprehension'}`;
        map.set(label, (map.get(label) || 0) + 1);
      });
    } else {
      (attempt.result?.buildDetails || []).filter((d) => !d.correct).forEach((d) => {
        (d.grammar || ['sentence structure']).forEach((tag) => { const key = `Build · ${tag}`; map.set(key, (map.get(key) || 0) + 1); });
      });
    }
  });
  return [...map.entries()].map(([label, misses]) => ({ label, misses })).sort((a,b)=>b.misses-a.misses).slice(0,5);
}

function sparkline(attempts, type) {
  const values = attempts
    .filter((item) => item.taskType === type && item.status === 'completed')
    .map((item) => {
      if (type === 'ctw' || type === 'reading') return (item.result?.score || 0) / Math.max(1, item.result?.maxScore || (type === 'reading' ? 35 : 10)) * 100;
      const email = item.result?.email?.score;
      const discussion = item.result?.discussion?.score;
      return Number.isFinite(email) && Number.isFinite(discussion) ? (email + discussion) / 10 * 100 : null;
    })
    .filter(Number.isFinite)
    .slice(0, 8)
    .reverse();
  if (!values.length) return `<div class="spark-empty">尚無趨勢</div>`;
  const width = 180, height = 48, pad = 4;
  const points = values.map((value, index) => {
    const x = values.length === 1 ? width / 2 : pad + index * ((width - pad * 2) / (values.length - 1));
    const y = height - pad - value / 100 * (height - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="sparkline" viewBox="0 0 ${width} ${height}" role="img" aria-label="Recent score trend"><polyline points="${points}" fill="none" vector-effect="non-scaling-stroke"/><line x1="0" x2="${width}" y1="${height - pad}" y2="${height - pad}"/></svg>`;
}

function errorWordFrequency(attempts) {
  const map = new Map();
  attempts.forEach((attempt) => {
    const details = attempt.taskType === 'ctw'
      ? (attempt.result?.details || [])
      : attempt.taskType === 'reading'
        ? (attempt.result?.details || []).filter((detail) => detail.type === 'ctw' && detail.scored)
        : [];
    details.filter((detail) => !detail.correct && detail.word).forEach((detail) => {
      const key = String(detail.word).toLowerCase();
      const current = map.get(key) || { word: detail.word, misses: 0, attempts: 0 };
      current.misses += 1;
      current.attempts += 1;
      map.set(key, current);
    });
  });
  return [...map.values()].sort((a, b) => b.misses - a.misses);
}

function renderVocabulary() {
  const data = currentData();

  const dueEntries = dueNotebookEntries(data);
  let words = ui.vocabFilter === 'saved'
    ? data.notebook
    : ui.vocabFilter === 'due'
      ? dueEntries
    : ui.vocabFilter === 'mistakes'
      ? VOCABULARY_BANK.filter((item) => mistakeWords.has(item.word.toLowerCase()))
      : VOCABULARY_BANK.filter((item) => ui.vocabFilter === 'all' || item.category === ui.vocabFilter);
  if (query) {
    words = words.filter((item) => [item.word, item.meaning, item.family, item.collocation, item.category, item.cefr].some((value) => String(value || '').toLowerCase().includes(query)));

  const cards = words.length ? words.map((item) => {
    const savedEntry = data.notebook.find((entry) => entry.word.toLowerCase() === item.word.toLowerCase());

  const total = coverage.covered.length + coverage.missing.length;

    <div class="coverage-meter-head"><div><strong>${esc(label)}</strong>${description ? `<span>${esc(description)}</span>` : ''}</div><b>${coverage.covered.length}/${total}</b></div>
    <div class="coverage-track" aria-label="${attr(label)} ${percent}% covered"><i style="width:${percent}%"></i></div>
    <div class="coverage-tags">${coverage.covered.map((item) => `<span class="covered">${esc(item)}</span>`).join('')}${coverage.missing.map((item) => `<span class="missing">${esc(item)}</span>`).join('')}</div>

}

function focusedBank(kind) {
  return kind === 'academic' ? ACADEMIC_PRACTICE_BANK : DAILY_PRACTICE_BANK;
}

function startFocusedPractice(kind, itemId = null, itemOverride = null, generationMeta = null) {
  const bank = focusedBank(kind);
  const item = itemOverride || bank.find((candidate) => candidate.id === itemId) || bank[Math.floor(Math.random() * bank.length)];
  ui.focused = {
    kind,
    item: structuredClone(item),
    answers: {},
    submitted: false,
    startedAt: Date.now(),
    generationMeta
  };
  ui.exam = null;
  ui.view = 'focused';
  render();
  requestAnimationFrame(() => document.querySelector('[data-focused-option]')?.focus());
}

function focusedResult(session = ui.focused) {
  const questions = session?.item?.questions || [];
  const details = questions.map((question) => ({
    id: question.id,
    response: session.answers?.[question.id] || '',
    answer: question.answer,
    correct: session.answers?.[question.id] === question.answer,
    skill: question.skill,
    explanation: question.explanation || ''
  }));
  return {
    score: details.filter((item) => item.correct).length,
    maxScore: details.length,
    unanswered: details.filter((item) => !item.response).length,
    details
  };
}

function renderFocusedPractice() {
  const session = ui.focused;
  if (!session?.item) {
    ui.view = 'practice';
    return renderPractice();
  }
  const item = session.item;
  const result = focusedResult(session);
  const kindLabel = session.kind === 'academic' ? 'Read an Academic Passage' : 'Read in Daily Life';
  const metadata = session.kind === 'academic'
    ? `${item.domain || 'Academic'} · ${countWords(item.text)} words · 5 questions`
    : `${String(item.type || 'daily').replaceAll('-', ' ')} · ${countWords(item.text)} words · ${(item.questions || []).length} questions`;
  const questions = (item.questions || []).map((question, index) => {
    const selected = session.answers[question.id] || '';
    const options = question.options.map((option) => {
      const correct = session.submitted && option.id === question.answer;
      const incorrect = session.submitted && option.id === selected && selected !== question.answer;
      return `<label class="focused-option ${correct ? 'correct' : ''} ${incorrect ? 'incorrect' : ''}"><input type="radio" name="focused-${attr(question.id)}" value="${attr(option.id)}" data-focused-option data-question-id="${attr(question.id)}" ${selected === option.id ? 'checked' : ''} ${session.submitted ? 'disabled' : ''}><span class="option-letter">${esc(option.id)}</span><span>${esc(option.text)}</span></label>`;
    }).join('');
    const detail = result.details[index];
    return `<article class="focused-question ${session.submitted ? (detail.correct ? 'answered-correct' : 'answered-wrong') : ''}"><div class="focused-question-head"><span>Question ${index + 1}</span>${session.submitted ? `<b>${detail.correct ? 'Correct' : 'Incorrect'} · ${esc(question.skill || '')}</b>` : ''}</div><h3>${esc(question.stem)}</h3><div class="focused-options">${options}</div>${session.submitted ? `<div class="focused-explanation"><strong>Answer: ${esc(question.answer)}</strong><p>${esc(question.explanation || 'No explanation available.')}</p></div>` : ''}</article>`;
  }).join('');
  return appShell(`
    <div class="focused-topbar"><button class="text-button" data-action="close-focused">${icon('back')} 回到練習選單</button><span class="status-pill neutral">GUIDED PRACTICE · NOT A MOCK</span></div>
    ${pageHeading('FOCUSED READING', kindLabel, metadata, session.submitted ? `<div class="result-badge big">${result.score}<span>/${result.maxScore}</span></div>` : '')}
    <section class="focused-layout">
      <article class="panel focused-stimulus"><div class="focused-stimulus-meta"><span>${esc(item.label || item.domain || kindLabel)}</span><b>Original practice item</b></div><h2>${esc(item.title)}</h2><div class="focused-stimulus-text">${esc(item.text).replace(/\n/g, '<br>')}</div></article>
      <div class="focused-question-list">${questions}</div>
    </section>
    <section class="focused-actions panel">
      <div>${session.submitted ? `<strong>${result.score}/${result.maxScore}</strong><span>檢查每題解析後，可換下一篇同題型原創練習。</span>` : `<strong>${Object.keys(session.answers).length}/${result.maxScore} answered</strong><span>Focused Practice 交卷後立即顯示答案與 skill；正式模考不會即時回饋。</span>`}</div>
      <div>${session.submitted ? `<button class="button ghost" data-action="restart-focused">再做一次</button><button class="button primary" data-action="next-focused">下一篇</button>` : `<button class="button primary" data-action="submit-focused">Check Answers</button>`}</div>
    </section>
  `);
}

function renderAttemptDetail(attempt) {
  if (!attempt) {
    ui.view = 'records';
    return renderRecords();

  const content = attempt.taskType === 'ctw'
    ? renderCtwReview(attempt)
    : attempt.taskType === 'reading'
      ? renderReadingReview(attempt)
      : renderWritingReview(attempt);
  return appShell(`
    <div class="detail-back"><button class="text-button" data-action="nav" data-view="records">${icon('back')} 回到作答紀錄</button></div>
    ${content}
  `);
}

function renderCtwReview(attempt) {
  const set = findCtestSet(attempt.setId);
  const sourceText = attempt.questionSnapshot?.sourceText || set.sourceText;
  const snapshotSet = { ...set, ...(attempt.questionSnapshot || {}), id: attempt.setId, title: attempt.questionSnapshot?.title || attempt.setTitle || set.title };
  const ctest = createCtest(sourceText, ctestOptionsForSet(snapshotSet));
  const details = attempt.result?.details || gradeCtest(ctest, attempt.answers).details;
  const detailMap = new Map(details.map((item) => [item.id, item]));
  const passage = ctest.segments.map((segment) => {
    if (segment.type === 'text') return esc(segment.text);
    const detail = detailMap.get(segment.id) || segment;
    return `<span class="review-gap ${detail.correct ? 'correct' : 'incorrect'}"><span>${esc(segment.visible)}</span><b>${esc(segment.answer)}</b><small>${detail.correct ? '✓' : esc(detail.response || 'blank')}</small></span>`;
  }).join('');
  const rows = details.map((item) => `
    <tr><td>${item.number}</td><td><strong>${esc(item.word)}</strong></td><td>${esc(item.visible)} + <b>${esc(item.answer)}</b></td><td class="${item.correct ? 'answer-ok' : 'answer-bad'}">${esc(item.response || '—')}</td><td>${item.correct ? '<span class="result-ok">Correct</span>' : '<span class="result-bad">Incorrect</span>'}</td><td><button class="bookmark-button small" data-action="save-review-word" data-word="${attr(item.word)}" data-set="${attr(attempt.setId)}">${icon('bookmark')}</button></td></tr>`).join('');
  return `
    ${pageHeading('READING REVIEW', snapshotSet.title, `${snapshotSet.domain} · ${snapshotSet.level} · ${formatDate(attempt.completedAt)}`, `<div class="result-badge big">${attempt.result?.score ?? 0}<span>/10</span></div>`)}
    <section class="panel review-passage"><div class="review-legend"><span><i class="correct"></i>正確</span><span><i class="incorrect"></i>錯誤／空白</span></div><p>${passage}</p></section>
    <section class="panel table-panel"><div class="panel-heading"><div><span class="eyebrow">ANSWER DETAILS</span><h2>10 個截斷詞</h2></div><span class="muted">只補 missing letters</span></div><div class="table-wrap"><table class="review-table"><thead><tr><th>#</th><th>完整單字</th><th>Target split</th><th>你的輸入</th><th>結果</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
    <section class="review-actions"><button class="button ghost" data-action="nav" data-view="vocabulary">查看單字本</button><button class="button primary" data-action="retry-attempt" data-id="${attr(attempt.id)}">再做一回</button></section>
  `;
}

  `;
