services:
  toefl-practice-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: toefl-2026-practice-lab:6.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 4173
    ports:
      - "4173:4173"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
